# ============================================================
# GENERATED FILE — DO NOT EDIT BY HAND.
# Produced by scripts/build-standalone-compose.py from:
#   docker-compose.yml + docker/vault.hcl + docker/vault-bootstrap.sh
#   + docker/vault-init.sh + docker/minio-init.sh
#   + docker/config/application.yaml
#
# A single self-contained Compose file: no repo checkout, no bind
# mounts. The init scripts and config are inlined below under the
# top-level `configs:` block. Requires Docker Compose >= 2.23.
#
# Run:
#   ANTHROPIC_API_KEY=sk-ant-... \
#     docker compose -f docker-compose.standalone.yml up -d
# (or place a .env next to this file — Compose reads it automatically)
# ============================================================

networks:
  datris-net:
    driver: bridge
  # Isolated network for tap execution (tap-execution-isolation Phase 3). The
  # datris-tap-runner sits here with NO route to datris-net's secret services
  # (vault, postgres, mongodb, minio). Only the datris server bridges both.
  tap-net:
    driver: bridge

volumes:
  pip-cache:
  tei-data:
  vault-data:        # persists Vault secrets across container recreation (drops dev mode)
  # Named data volumes for the three stateful stores. These MUST be named:
  # anonymous volumes survive a plain recreate but are orphaned (left behind,
  # not reattached) whenever the container is removed — `down` + `up`, or a
  # store disabled via its *_ENABLED gate and later re-enabled. Named volumes
  # reattach every time, which is what makes disable → re-enable lossless.
  postgres-data:
  mongodb-data:
  mongodb-configdb:
  minio-data:
  kafka-data:        # used by the opt-in kafka profile (COMPOSE_PROFILES=kafka)
  zookeeper-data:    # used by the opt-in kafka profile
  zookeeper-log:     # used by the opt-in kafka profile
  # ollama-data:       # uncomment if re-enabling the optional Ollama service below

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - datris-net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-configdb:/data/configdb
    networks:
      - datris-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    # Opt-OUT gate (install-time database selection). Absent var → 1 → runs,
    # so every pre-existing .env keeps its postgres on upgrade. Set
    # POSTGRES_ENABLED=0 in .env to skip the bundled container (e.g. when
    # using an external Postgres — see POSTGRES_JDBC_URL in .env.example).
    # Never gate existing services with profiles: a missing COMPOSE_PROFILES
    # can't be defaulted from this file and would silently drop the service.
    deploy:
      replicas: ${POSTGRES_ENABLED:-1}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    # File storage on a named volume — secrets PERSIST across container
    # recreation (`--build`, `down && up`, host reboot). Replaces dev mode,
    # which kept everything in memory and wiped it on every restart. The
    # init/unseal lifecycle is handled by docker/vault-bootstrap.sh.
    command: ["vault", "server", "-config=/vault/config/vault.hcl"]
    cap_add:
      - IPC_LOCK
    configs:
      - source: vault-hcl
        target: /vault/config/vault.hcl
        mode: 0644
    volumes:
      - vault-data:/vault/file
    # A non-dev Vault boots SEALED and reports 501 (uninitialized) / 503
    # (sealed) on /sys/health. The query params make those states count as
    # healthy so vault-bootstrap can start and unseal it. Once unsealed it's a
    # normal 200.
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8200/v1/sys/health?uninitcode=200&sealedcode=200&standbycode=200"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      # No static VAULT_TOKEN — a non-dev Vault generates a random root token at
      # init. vault-bootstrap.sh reads it from the init file on the shared
      # vault-data volume and mints a fixed-id `root-token` token for the server.
      DATRIS_UI_API_KEY: ${DATRIS_UI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      CODEGEN_MODEL: ${CODEGEN_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-}
      # External / optional stores (install-time database selection). All are
      # first-boot seeds consumed by vault-init.sh: postgres vars fall back to
      # the bundled container's coordinates; the others seed their secret only
      # when set (unset → store stays unconfigured, exactly like today).
      POSTGRES_JDBC_URL: ${POSTGRES_JDBC_URL:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      QDRANT_HOST: ${QDRANT_HOST:-}
      QDRANT_PORT: ${QDRANT_PORT:-}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      WEAVIATE_HOST: ${WEAVIATE_HOST:-}
      WEAVIATE_PORT: ${WEAVIATE_PORT:-}
      WEAVIATE_API_KEY: ${WEAVIATE_API_KEY:-}
      CHROMA_HOST: ${CHROMA_HOST:-}
      CHROMA_PORT: ${CHROMA_PORT:-}
      MILVUS_HOST: ${MILVUS_HOST:-}
      MILVUS_PORT: ${MILVUS_PORT:-}
      MILVUS_API_KEY: ${MILVUS_API_KEY:-}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PRIVATE_KEY: ${SNOWFLAKE_PRIVATE_KEY:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      DATABRICKS_HOST: ${DATABRICKS_HOST:-}
      DATABRICKS_CLIENT_ID: ${DATABRICKS_CLIENT_ID:-}
      DATABRICKS_CLIENT_SECRET: ${DATABRICKS_CLIENT_SECRET:-}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN:-}
    configs:
      - source: vault-bootstrap-sh
        target: /vault-bootstrap.sh
        mode: 0755
      - source: vault-init-sh
        target: /vault-init.sh
        mode: 0755
    volumes:
      - vault-data:/vault/file
    entrypoint: ["/bin/sh", "/vault-bootstrap.sh"]
    restart: "no"
    networks:
      - datris-net

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    platform: linux/amd64   # TEI publishes amd64 only; arm64 hosts run under Docker's QEMU translation
    container_name: tei
    # Opt-OUT gate: absent var → 1 → runs (backward safe). Set TEI_ENABLED=0
    # to skip the local embedding server — recommended when using OpenAI
    # embeddings (EMBEDDING_PROVIDER=openai), which needs no local container.
    deploy:
      replicas: ${TEI_ENABLED:-1}
    ports:
      - "11434:80"   # external port preserved so any prior EMBEDDING_ENDPOINT overrides keep working
    command: --model-id BAAI/bge-m3 --max-batch-tokens 8192
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei-data:/data
    # TEI's Rust HTTP client under amd64-emulation on arm64 hosts can fail to resolve
    # huggingface.co via Docker's embedded DNS (127.0.0.11) on user-defined bridges.
    # Pin to public resolvers so the first-run model download succeeds.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # first-run model download (~2.2 GB)
    networks:
      - datris-net

  datris:
    image: datrisai/datris-server:latest
    #build: .  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: datris
    ports:
      - "8080:8080"
    # No depends_on for postgres/tei: both are optional (replicas-gated above)
    # and lazily connected by the server — a service_healthy condition on a
    # replicas-0 service would block startup forever. Required core only.
    depends_on:
      vault-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      activemq:
        condition: service_started
      mongodb:
        condition: service_started
    environment:
      VAULT_ADDR: http://vault:8200
      # The server authenticates with this token id. vault-bootstrap.sh mints a
      # token with the fixed id `root-token` (the real root token is random on a
      # non-dev Vault), so this value is unchanged from the old dev-mode setup.
      VAULT_TOKEN: root-token
      # Auth / multi-tenancy toggles. Defaults preserve OSS single-tenant behavior;
      # flip these in your .env to enable user auth, API-key gating, or multi-tenant
      # mode without rebuilding the JAR. Spring's relaxed binding maps these env
      # names onto useUserAuth / useApiKeys / multiTenant in application.yaml.
      USEUSERAUTH: "${USE_USER_AUTH:-false}"
      USEAPIKEYS: "${USE_API_KEYS:-false}"
      MULTITENANT: "${MULTI_TENANT:-false}"
      # Capability enforcement: `enforce` (default) returns HTTP 403 on policy
      # violations by scoped keys. Override to `log-only` in .env to emit
      # would-deny log lines without rejecting — useful only when iterating
      # on a new scope policy and you want a trial run before flipping on.
      # Legacy `*:*` keys are unaffected either way.
      CAPABILITY_ENFORCEMENT: "${CAPABILITY_ENFORCEMENT:-enforce}"
      # Operator-override fallback model when Anthropic Opus is sustained-
      # overloaded; read by AgentLoop.sonnetFallbackFor() at runtime.
      ANTHROPIC_OVERLOAD_FALLBACK_MODEL: "${ANTHROPIC_OVERLOAD_FALLBACK_MODEL:-}"
      # Provider API keys exposed to the Scala runtime for AIUtil.resolveApiKey's
      # env-var fallback (gated to single-tenant). Used when an AI section's Vault
      # secret has no apiKey of its own — e.g. user enabled web search via UI but
      # the right-hand panel showed the masked placeholder so no real key reached
      # oss/web-search. The runtime then falls back to these. Multi-tenant tenants
      # don't fall through (multiTenant=true short-circuits the helper) so platform
      # keys never leak across tenants.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # JVM heap sizing for the datris-server process. Default fits an 8GB
      # trial droplet alongside TEI, postgres, mongo, etc. Override in .env
      # (e.g. JAVA_OPTS=-Xms1g -Xmx8g) on larger hosts.
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx2g}"
      # Tap execution isolation (Phase 3). When USE_TAP_RUNNER=true, tap fetch()
      # code runs in the datris-tap-runner sidecar (no secrets, no Vault route)
      # instead of in-process. Default false preserves the zero-dependency OSS
      # quick-start. The shared token authenticates the server→runner call.
      USE_TAP_RUNNER: "${USE_TAP_RUNNER:-false}"
      TAP_RUNNER_URL: "http://datris-tap-runner:8090"
      TAP_RUNNER_TOKEN: "${TAP_RUNNER_TOKEN:-changeme-tap-runner-token}"
    configs:
      - source: datris-app-yaml
        target: /config/application.yaml
    volumes:
      - pip-cache:/root/.cache/pip
    networks:
      - datris-net
      - tap-net

  # Isolated tap execution sidecar (tap-execution-isolation Phase 3). Holds no
  # platform secrets and lives only on tap-net (no route to vault/postgres/mongo/
  # minio). Hardened: non-root (from image), read-only root FS, tmpfs scratch only,
  # all capabilities dropped, no privilege escalation. Only used when the datris
  # server has USE_TAP_RUNNER=true.
  datris-tap-runner:
    image: datrisai/datris-tap-runner:latest
    #build: ./tap-runner  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: datris-tap-runner
    environment:
      TAP_RUNNER_TOKEN: "${TAP_RUNNER_TOKEN:-changeme-tap-runner-token}"
    read_only: true
    # Scratch must allow exec: runtime-installed packages (venv interpreter, pip, and
    # any C-extension .so) live here and must be loadable. Safe — the tap is already
    # arbitrary Python; root FS stays read-only and scratch is wiped per run.
    tmpfs:
      - /tmp:size=512m,mode=1777,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - tap-net

  ui:
    image: datrisai/datris-ui:latest
    #build: ./ui  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: ui
    ports:
      - "4200:8080"
    depends_on:
      - datris
    networks:
      - datris-net

  mcp-server:
    image: datrisai/datris-mcp-server:latest
    #build: ./mcp-server  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: mcp-server
    ports:
      - "3000:3000"
    environment:
      DATRIS_API_URL: http://datris:8080
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: "6333"
      WEAVIATE_HOST: host.docker.internal
      WEAVIATE_PORT: "8079"
      WEAVIATE_GRPC_PORT: "50051"
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: "19530"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: datris
      PG_USER: postgres
      PG_PASSWORD: postgres
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: oss
    depends_on:
      - datris
    networks:
      - datris-net

  # ================================================================
  # Optional Vector Databases — opt-IN via compose profiles.
  # Enable in .env, e.g.:  COMPOSE_PROFILES=qdrant  (comma-separate for more)
  # Profiles (not replicas gates) are correct here BECAUSE these services
  # never ran by default — default-off can't drop anything on upgrade, and
  # profile-inactive services are skipped by `docker compose pull`.
  # pgvector is already included via the PostgreSQL service above.
  # ================================================================

  # Qdrant - high-performance vector database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    profiles: ["qdrant"]
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - datris-net

  # Weaviate - open-source vector database (port 8079 to avoid conflict with pipeline on 8080)
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:latest
    container_name: weaviate
    profiles: ["weaviate"]
    ports:
      - "8079:8080"
      - "50051:50051"
    networks:
      - datris-net

  # Chroma - lightweight vector database
  chroma:
    image: chromadb/chroma:latest
    container_name: chroma
    profiles: ["chroma"]
    ports:
      - "8000:8000"
    networks:
      - datris-net

  # Milvus - scalable vector database (requires etcd + minio dependencies), so
  # it is NOT bundled as a profile. Point Datris at an external/standalone
  # Milvus instead. See https://milvus.io/docs/install_standalone-docker.md:
  #   curl -sfL https://raw.githubusercontent.com/milvus-io/milvus/master/scripts/standalone_embed.sh -o standalone_embed.sh
  #   bash standalone_embed.sh start

  # ================================================================
  # Optional: Ollama (local chat / CodeGen models)
  # The bundled embedding model has moved to the `tei` service above.
  # Re-enable this block (and the `ollama-data` volume at the top of
  # the file) only if you want to run local chat models like llama3
  # or qwen instead of using BYO Anthropic/OpenAI keys.
  # After uncommenting + `docker compose up -d ollama`, point Datris
  # at it via the AI Provider / CodeGen Provider dropdown in the
  # Configuration tab (provider: ollama).
  # NOTE: TEI takes host port 11434, so Ollama is mapped to 11435 here
  # to avoid a conflict.
  # ================================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11435:11434"
  #   environment:
  #     OLLAMA_NUM_PARALLEL: 4
  #     OLLAMA_KEEP_ALIVE: 30m
  #     OLLAMA_MAX_LOADED_MODELS: 2
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - datris-net

  # ================================================================
  # Optional: Kafka + Zookeeper + kafka-ui — opt-IN via the `kafka` profile
  # (COMPOSE_PROFILES=kafka in .env). Datris ships with kafka-clients in the
  # assembly, so pipelines that use a Kafka source/destination can point at
  # any external broker via the pipeline's Kafka secret (Confluent Cloud /
  # MSK is the expected production shape — see KAFKA_BOOTSTRAP_SERVERS in
  # .env.example). This bundled local broker is only for testing Kafka
  # pipelines without spinning up a broker elsewhere.
  # ================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    profiles: ["kafka"]
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - datris-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["kafka"]
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - datris-net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
      datris:
        condition: service_started
    configs:
      - source: minio-init-sh
        target: /minio-init.sh
        mode: 0755
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"
    networks:
      - datris-net

configs:
  vault-hcl:
    content: |
      # Datris Vault configuration — file storage backend.
      #
      # Replaces dev mode so secrets, AI providers/models, tap secrets, and UI
      # Configuration changes SURVIVE `docker compose up --build` / `down && up` /
      # host reboot. Everything here is Vault Community Edition (free) — no
      # Enterprise features.
      #
      # Lifecycle (handled by docker/vault-bootstrap.sh): a non-dev Vault boots
      # SEALED and must be initialized once and unsealed on every start. The
      # bootstrap stores the generated unseal key + root token on this same
      # `vault-data` volume and auto-unseals from it on every boot. That is no more
      # secure than the old known `root-token`, but it is appropriate for the
      # local / single-tenant box Datris ships as.

      # /vault/file (not /vault/data): this dir exists in the image owned by the
      # vault user (uid 100), so a fresh named volume mounted here inherits writable
      # ownership. /vault/data does not exist in the image — a volume there is
      # root-owned and the vault process (which drops to uid 100) cannot write to it.
      storage "file" {
        path = "/vault/file"
      }

      listener "tcp" {
        address     = "0.0.0.0:8200"
        tls_disable = "true"   # TLS terminates upstream (nginx / load balancer); intra-compose traffic only
      }

      # Redirect address used inside the compose network.
      api_addr = "http://vault:8200"

      ui = true
  vault-bootstrap-sh:
    content: |
      #!/bin/sh
      set -e

      # Datris Vault bootstrap — runs in the vault-init container before seeding.
      #
      # Dev mode used to hide all of this (auto-init, auto-unseal, known root token).
      # With file storage Vault boots SEALED and must be initialized once and
      # unsealed on every start. This script:
      #   1. waits for Vault to be reachable,
      #   2. initializes it on first run (storing the unseal key + root token on the
      #      shared vault-data volume),
      #   3. unseals it from the stored Shamir key,
      #   4. enables KV v2 at secret/ (dev mode did this implicitly),
      #   5. mints a fixed-id token so the datris server's `VAULT_TOKEN: root-token`
      #      keeps working unchanged,
      #   6. hands off to vault-init.sh for create-if-absent seeding.
      #
      # Everything after first run is idempotent: secrets persist on the volume, so
      # reboots only unseal + re-mint the server token (if absent) and skip seeding
      # of any path that already exists.

      INIT_FILE=/vault/file/datris-init.txt
      SERVER_TOKEN_ID="$${DATRIS_VAULT_TOKEN:-root-token}"

      echo "vault-bootstrap: waiting for Vault to respond..."
      # `vault status` exit codes: 0 = unsealed, 2 = sealed (both mean reachable),
      # 1 = not reachable yet. Capture the code inside the `else` (where $$? still
      # holds the condition's status) — a bare `vault status; code=$$?` would trip
      # `set -e` and abort before we could read the code, since sealed/unreachable
      # are non-zero and that's the whole state we're waiting through.
      while true; do
        if vault status >/dev/null 2>&1; then
          break
        else
          code=$$?
          [ "$$code" -eq 2 ] && break
        fi
        sleep 1
      done

      # 1. Initialize on first run only. `operator init -status` exits 0 if already
      #    initialized, 2 if not.
      if vault operator init -status >/dev/null 2>&1; then
        echo "vault-bootstrap: Vault already initialized."
      else
        echo "vault-bootstrap: initializing Vault (first run)..."
        # Single Shamir key — appropriate for the local / single-tenant box.
        vault operator init -key-shares=1 -key-threshold=1 > "$$INIT_FILE"
        chmod 600 "$$INIT_FILE" 2>/dev/null || true
      fi

      if [ ! -f "$$INIT_FILE" ]; then
        echo "vault-bootstrap: ERROR: $$INIT_FILE missing — cannot recover root token." >&2
        echo "vault-bootstrap: delete the vault-data volume to re-initialize from scratch." >&2
        exit 1
      fi

      UNSEAL_KEY=$$(grep -i 'Unseal Key 1:' "$$INIT_FILE" | awk '{print $$NF}')
      ROOT_TOKEN=$$(grep -i 'Initial Root Token:' "$$INIT_FILE" | awk '{print $$NF}')

      if [ -z "$$ROOT_TOKEN" ]; then
        echo "vault-bootstrap: ERROR: could not read root token from $$INIT_FILE." >&2
        exit 1
      fi

      # 2/3. Unseal if sealed.
      SEALED=$$(vault status 2>/dev/null | awk '/^Sealed/ {print $$2}')
      if [ "$$SEALED" = "true" ]; then
        if [ -n "$$UNSEAL_KEY" ]; then
          echo "vault-bootstrap: unsealing Vault..."
          vault operator unseal "$$UNSEAL_KEY" >/dev/null
        else
          echo "vault-bootstrap: ERROR: Vault sealed but no Shamir unseal key found in $$INIT_FILE." >&2
          exit 1
        fi
      fi

      export VAULT_TOKEN="$$ROOT_TOKEN"

      # 4. Enable KV v2 at secret/ (dev mode mounted this automatically).
      if ! vault secrets list 2>/dev/null | grep -q '^secret/'; then
        echo "vault-bootstrap: enabling KV v2 at secret/..."
        vault secrets enable -path=secret -version=2 kv >/dev/null
      fi

      # 5. Policy + fixed-id token for the datris server. The server authenticates
      #    with `VAULT_TOKEN: root-token` (unchanged from dev mode) — we mint a
      #    token with that exact id so nothing downstream has to change.
      vault policy write datris - >/dev/null <<'EOF'
      path "secret/*" {
        capabilities = ["create", "read", "update", "delete", "list"]
      }
      EOF

      if ! VAULT_TOKEN="$$SERVER_TOKEN_ID" vault token lookup >/dev/null 2>&1; then
        echo "vault-bootstrap: creating datris server token (id=$$SERVER_TOKEN_ID)..."
        # Orphan + periodic so it survives reboots without a parent and is exempt from
        # the system max-TTL. The 10-year period makes it effectively non-expiring on
        # a long-running box without anyone renewing it — matching the old dev-mode
        # root-token (which never expired). bootstrap also re-mints it on any restart
        # if it's somehow missing, so this self-heals.
        vault token create -id="$$SERVER_TOKEN_ID" -policy=datris -orphan -period=87600h >/dev/null
      fi

      # 6. Seed (create-if-absent). vault-init.sh inherits VAULT_TOKEN from the env.
      echo "vault-bootstrap: handing off to vault-init.sh for seeding..."
      exec /bin/sh /vault-init.sh
  vault-init-sh:
    content: |
      #!/bin/sh
      set -e

      echo "Waiting for Vault to be ready..."
      until vault status > /dev/null 2>&1; do
        sleep 1
      done

      # Create-if-absent seeding. With persistent (non-dev) Vault, secrets survive
      # restarts, so seeding must NOT overwrite a path that already holds a value —
      # otherwise the .env defaults would clobber the user's persisted UI changes on
      # every reboot. Each path is seeded only when it does not yet exist: on a fresh
      # volume that's every path, on a reboot that's none.
      seed_if_absent() {
        _path="$$1"
        shift
        if vault kv get "$$_path" > /dev/null 2>&1; then
          echo "  $$_path already present — keeping persisted value"
          return 0
        fi
        echo "  seeding $$_path"
        vault kv put "$$_path" "$$@"
      }

      # Does a path already hold a value? (Used to skip whole blocks whose seeding
      # would otherwise run provider validation that can fail on reboot when the
      # operator has since removed keys from .env — .env is first-boot seed only.)
      exists() {
        vault kv get "$$1" > /dev/null 2>&1
      }

      echo "Seeding Vault secrets (create-if-absent)..."

      seed_if_absent secret/oss/minio accessKey=minioadmin secretKey=minioadmin
      seed_if_absent secret/oss/activemq username=admin password=admin
      seed_if_absent secret/oss/mongodb connectionString=mongodb://mongodb:27017 database=oss
      # The UI API key — operator-supplied via DATRIS_UI_API_KEY in .env, or a
      # stable fallback for fresh local installs. Seeded in two places so the
      # auth layer recognizes it AND the operator can rotate it from the UI:
      #   - oss/api-keys[ui] is the validation source (APIKeyValidator looks here)
      #   - oss/ui-api-key is the operator-facing record (rotatable in Secrets UI;
      #     on save, the server auto-mirrors the new value into oss/api-keys[ui])
      UI_API_KEY_VALUE="$${DATRIS_UI_API_KEY:-default-ui-key}"
      seed_if_absent secret/oss/api-keys ui="$${UI_API_KEY_VALUE}"
      seed_if_absent secret/oss/ui-api-key apiKey="$${UI_API_KEY_VALUE}"
      # Postgres: env vars (installer-written, for an external Postgres) fall back
      # to the bundled container's coordinates — absent vars reproduce today's seed.
      # POSTGRES_JDBC_URL is the BASE url (no database segment), matching the
      # bundled format; the destination database is a per-pipeline/config setting.
      seed_if_absent secret/oss/postgres \
        jdbcUrl="$${POSTGRES_JDBC_URL:-jdbc:postgresql://postgres:5432}" \
        username="$${POSTGRES_USER:-postgres}" \
        password="$${POSTGRES_PASSWORD:-postgres}"

      # kafka-producer: seeded only when a broker list is supplied (installer or
      # operator) — bundled test broker (kafka:9092 with COMPOSE_PROFILES=kafka) or
      # an external one. Unset → not seeded, exactly like before, so the health
      # card shows "Not Configured" rather than "Down". Manual alternative:
      #   vault kv put secret/oss/kafka-producer bootstrapServers=kafka:9092
      if [ -n "$${KAFKA_BOOTSTRAP_SERVERS:-}" ]; then
        seed_if_absent secret/oss/kafka-producer bootstrapServers="$${KAFKA_BOOTSTRAP_SERVERS}"
      fi

      # Snowflake / Databricks destination credentials — seeded as ordinary
      # (non-tap) secrets, so they appear as human-owned Platform secrets that
      # pipelines reference via credentialsSecret (agents can discover but never
      # modify them). Seeded only when the anchor field is present; field names
      # match CredentialResolver's canonical spellings. Warehouse/catalog/database
      # are per-pipeline settings and deliberately NOT stored here.
      if [ -n "$${SNOWFLAKE_ACCOUNT:-}" ]; then
        seed_if_absent secret/oss/snowflake \
          account="$${SNOWFLAKE_ACCOUNT}" \
          user="$${SNOWFLAKE_USER:-}" \
          privateKey="$${SNOWFLAKE_PRIVATE_KEY:-}" \
          password="$${SNOWFLAKE_PASSWORD:-}"
      fi
      if [ -n "$${DATABRICKS_HOST:-}" ]; then
        seed_if_absent secret/oss/databricks \
          host="$${DATABRICKS_HOST}" \
          clientId="$${DATABRICKS_CLIENT_ID:-}" \
          clientSecret="$${DATABRICKS_CLIENT_SECRET:-}" \
          token="$${DATABRICKS_TOKEN:-}"
      fi

      # AI configuration — three independent, self-describing secrets.
      # Each Vault secret carries provider/endpoint/model/apiKey/version inline so
      # the resolver never derives the path from a YAML provider field.
      #
      # Skip the whole block once ai-primary AND codegen exist: with persistence
      # these survive reboots, and re-running the provider resolution below would
      # fail when the operator has removed keys from .env (now first-boot seed only).
      if exists secret/oss/ai-primary && exists secret/oss/codegen; then
        echo "  secret/oss/ai-primary + secret/oss/codegen already present — skipping AI seed"
      else
        # Provider selection:
        #   1. AI_PROVIDER (anthropic|openai) is the explicit override — always wins.
        #      Use this in .env to pin a choice when shell env vars (e.g. a global
        #      OPENAI_API_KEY exported from your shell rc) would otherwise leak in
        #      and silently flip the default on every rebuild.
        #   2. If AI_PROVIDER is unset, fall back to "whichever key is present",
        #      with OpenAI winning ties — preserves the historical default.
        PROVIDER="$${AI_PROVIDER:-}"
        if [ -z "$$PROVIDER" ]; then
          if [ -n "$${OPENAI_API_KEY:-}" ]; then
            PROVIDER="openai"
          elif [ -n "$${ANTHROPIC_API_KEY:-}" ]; then
            PROVIDER="anthropic"
          fi
        fi

        if [ "$$PROVIDER" = "openai" ]; then
          if [ -z "$${OPENAI_API_KEY:-}" ]; then
            echo "ERROR: AI_PROVIDER=openai but OPENAI_API_KEY is not set." >&2
            exit 1
          fi
          seed_if_absent secret/oss/ai-primary \
            provider="openai" \
            endpoint="https://api.openai.com/v1/chat/completions" \
            model="$${OPENAI_MODEL:-gpt-5.5}" \
            apiKey="$${OPENAI_API_KEY}"
          seed_if_absent secret/oss/codegen \
            provider="openai" \
            endpoint="https://api.openai.com/v1/chat/completions" \
            model="$${CODEGEN_MODEL:-gpt-5.5}" \
            apiKey="$${OPENAI_API_KEY}"
        elif [ "$$PROVIDER" = "anthropic" ]; then
          if [ -z "$${ANTHROPIC_API_KEY:-}" ]; then
            echo "ERROR: AI_PROVIDER=anthropic but ANTHROPIC_API_KEY is not set." >&2
            exit 1
          fi
          # Fresh installs default ai-primary to Opus: strongest chat/NL→SQL model,
          # matching the codegen default below (decided 2026-07-14). Existing vaults
          # keep whatever they have (seed_if_absent); ANTHROPIC_MODEL still overrides.
          # Sustained-overload downgrades are handled at runtime via
          # ANTHROPIC_OVERLOAD_FALLBACK_MODEL.
          seed_if_absent secret/oss/ai-primary \
            provider="anthropic" \
            endpoint="https://api.anthropic.com/v1/messages" \
            model="$${ANTHROPIC_MODEL:-claude-opus-4-8}" \
            apiKey="$${ANTHROPIC_API_KEY}" \
            version="2023-06-01"
          seed_if_absent secret/oss/codegen \
            provider="anthropic" \
            endpoint="https://api.anthropic.com/v1/messages" \
            model="$${CODEGEN_MODEL:-claude-opus-4-8}" \
            apiKey="$${ANTHROPIC_API_KEY}" \
            version="2023-06-01"
        else
          echo "ERROR: No AI provider configured. Set AI_PROVIDER=(anthropic|openai), or set ANTHROPIC_API_KEY / OPENAI_API_KEY in .env." >&2
          exit 1
        fi
      fi

      # Embedding slot — decoupled from AI_PROVIDER so users can mix-and-match
      # (e.g. Anthropic for chat/codegen + OpenAI for embedding when bundled TEI
      # is unreliable on a small host).
      #
      # Skip once present (same first-boot-seed-only reasoning as the AI block).
      if exists secret/oss/embedding; then
        echo "  secret/oss/embedding already present — skipping embedding seed"
      else
        # Selection precedence:
        #   1. EMBEDDING_PROVIDER (openai|tei|ollama) — explicit override.
        #   2. Otherwise: AI_PROVIDER=openai → OpenAI embeddings;
        #                 AI_PROVIDER=anthropic → bundled TEI (bge-m3, 1024-dim).
        EMBEDDING_PROVIDER_RESOLVED="$${EMBEDDING_PROVIDER:-}"
        if [ -z "$$EMBEDDING_PROVIDER_RESOLVED" ]; then
          if [ "$${PROVIDER:-}" = "openai" ]; then
            EMBEDDING_PROVIDER_RESOLVED="openai"
          else
            EMBEDDING_PROVIDER_RESOLVED="tei"
          fi
        fi

        if [ "$$EMBEDDING_PROVIDER_RESOLVED" = "openai" ]; then
          if [ -z "$${OPENAI_API_KEY:-}" ]; then
            echo "ERROR: EMBEDDING_PROVIDER=openai but OPENAI_API_KEY is not set." >&2
            exit 1
          fi
          seed_if_absent secret/oss/embedding \
            provider="openai" \
            endpoint="https://api.openai.com/v1/embeddings" \
            model="$${EMBEDDING_MODEL:-text-embedding-3-small}" \
            apiKey="$${OPENAI_API_KEY}"
        elif [ "$$EMBEDDING_PROVIDER_RESOLVED" = "tei" ]; then
          seed_if_absent secret/oss/embedding \
            provider="tei" \
            endpoint="$${EMBEDDING_ENDPOINT:-http://tei:80/v1/embeddings}" \
            model="$${EMBEDDING_MODEL:-BAAI/bge-m3}" \
            apiKey=""
        elif [ "$$EMBEDDING_PROVIDER_RESOLVED" = "ollama" ]; then
          seed_if_absent secret/oss/embedding \
            provider="ollama" \
            endpoint="$${EMBEDDING_ENDPOINT:-http://ollama:11434/v1/embeddings}" \
            model="$${EMBEDDING_MODEL:-bge-m3}" \
            apiKey=""
        else
          echo "ERROR: Unknown EMBEDDING_PROVIDER='$$EMBEDDING_PROVIDER_RESOLVED'. Expected: openai, tei, or ollama." >&2
          exit 1
        fi
      fi

      # Vector store secrets.
      # pgvector is seeded by default — it rides on the (bundled or external)
      # Postgres so it's available whenever Postgres is. The other vector stores
      # (qdrant, weaviate, milvus, chroma) are seeded ONLY when their HOST var is
      # set (installer-written: the compose service name for a bundled profile
      # service, or a real hostname for a managed/cloud instance). Seeding them
      # unconditionally would make the Configuration tab's Service Health card
      # show them as "Down" instead of "Not Configured" when the user hasn't
      # enabled them. Manual alternative stays available:
      #   vault kv put secret/oss/qdrant host="host.docker.internal" port="6334" apiKey=""
      seed_if_absent secret/oss/pgvector \
        jdbcUrl="$${POSTGRES_JDBC_URL:-jdbc:postgresql://postgres:5432}/datris" \
        username="$${POSTGRES_USER:-postgres}" \
        password="$${POSTGRES_PASSWORD:-postgres}"
      if [ -n "$${QDRANT_HOST:-}" ]; then
        seed_if_absent secret/oss/qdrant \
          host="$${QDRANT_HOST}" port="$${QDRANT_PORT:-6334}" apiKey="$${QDRANT_API_KEY:-}"
      fi
      if [ -n "$${WEAVIATE_HOST:-}" ]; then
        seed_if_absent secret/oss/weaviate \
          host="$${WEAVIATE_HOST}" port="$${WEAVIATE_PORT:-8079}" apiKey="$${WEAVIATE_API_KEY:-}"
      fi
      if [ -n "$${MILVUS_HOST:-}" ]; then
        seed_if_absent secret/oss/milvus \
          host="$${MILVUS_HOST}" port="$${MILVUS_PORT:-19530}" apiKey="$${MILVUS_API_KEY:-}"
      fi
      if [ -n "$${CHROMA_HOST:-}" ]; then
        seed_if_absent secret/oss/chroma \
          host="$${CHROMA_HOST}" port="$${CHROMA_PORT:-8000}"
      fi

      echo "Vault secrets seeded successfully."
  minio-init-sh:
    content: |
      #!/bin/bash
      set -e

      echo "Waiting for MinIO to be ready..."
      until mc alias set myminio http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; do
        sleep 2
      done

      echo "Creating buckets..."
      mc mb --ignore-existing myminio/oss-config
      mc mb --ignore-existing myminio/oss-raw
      mc mb --ignore-existing myminio/oss-raw-plus
      mc mb --ignore-existing myminio/oss-temp

      echo "Waiting for Pipeline server to be reachable..."
      until bash -c 'echo > /dev/tcp/datris/8080' 2>/dev/null; do
        sleep 3
      done
      echo "Pipeline server is reachable."

      echo "Configuring MinIO webhook notification endpoint..."
      mc admin config set myminio notify_webhook:1 \
        endpoint=http://datris:8080/minio-events \
        queue_limit=1000 \
        queue_dir=/tmp/minio-events

      echo "Restarting MinIO to apply notification config..."
      mc admin service restart myminio --json 2>/dev/null || true

      echo "Waiting for MinIO to come back..."
      sleep 5
      until mc alias set myminio http://minio:9000 minioadmin minioadmin > /dev/null 2>&1; do
        sleep 2
      done

      echo "Setting up bucket event notifications on oss-raw..."
      mc event remove myminio/oss-raw --force 2>/dev/null || true
      mc event add myminio/oss-raw arn:minio:sqs::1:webhook --suffix .metadata.json --event put
      mc event add myminio/oss-raw arn:minio:sqs::1:webhook --suffix .pipeline.csv --event put
      mc event add myminio/oss-raw arn:minio:sqs::1:webhook --suffix .pipeline.json --event put
      mc event add myminio/oss-raw arn:minio:sqs::1:webhook --suffix .pipeline.xml --event put

      echo "MinIO initialization complete."
      echo ""
      echo "============================================"
      echo "  Datris Platform is ready!"
      echo "============================================"
      echo ""
      echo "  Pipeline UI:     http://localhost:4200"
      echo "  Pipeline API:    http://localhost:8080"
      echo "  MCP Server:      http://localhost:3000/sse"
      echo "  MinIO Console:   http://localhost:9001"
      echo "  Kafka UI:        http://localhost:8085"
      echo "  ActiveMQ:        http://localhost:8161"
      echo "  Vault:           http://localhost:8200"
      echo ""
      echo "============================================"
  datris-app-yaml:
    content: |
      # Docker Compose overrides. Spring loads this on top of the JAR-bundled
      # application.yaml via --spring.config.additional-location (see docker-init.sh).
      # Keep this file as small as possible — only set values that genuinely differ
      # from the bundled defaults in localhost mode. Anything else inherits.
      #
      # To toggle auth / multi-tenancy / api-keys, do NOT add them here — set
      # USE_USER_AUTH / USE_API_KEYS / MULTI_TENANT in your .env instead. They
      # flow through docker-compose.yml as USEUSERAUTH / USEAPIKEYS / MULTITENANT
      # env vars and Spring's relaxed binding overrides the YAML at runtime.

      spring:
        data:
          mongodb:
            uri: mongodb://mongodb:27017/datris

      minio:
        server: http://minio:9000

      activemq:
        server: tcp://activemq:61616

      mongodb:
        connectionString: mongodb://mongodb:27017

      kafkaConsumer:
        bootstrapServers: kafka:9092
