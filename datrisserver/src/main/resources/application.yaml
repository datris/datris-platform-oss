spring:
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  server:
    tomcat:
      connection-timeout: "600000"
  data:
    mongodb:
      uri: mongodb://localhost:27017/oss
  management:
    health:
      probes:
        enabled: "true"
      livenessState:
        enabled: "true"
      readinessState:
        enabled: "true"
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    ai.datris: INFO
schedule:
  checkFileNotifierQueue: "5000"
  findJobsToStart: "5000"
  checkDatabaseSourceQueries: "30000"
  checkTapSchedules: "30000"
tapScriptTimeoutSeconds: "300"
dateFormat: "yyyy-MM-dd HH:mm:ss z"
dateTimezone: "America/New_York"
environment: oss
useApiKeys: "false"
multiTenant: "false"

# CORS allowed origins (comma-separated). Use "*" for any origin (dev only).
# Production: lock down to specific origins, e.g. "https://app.datris.ai,https://admin.datris.ai"
cors:
  allowedOrigins: "*"

# Object store: MinIO
minio:
  server: http://localhost:9000

# Secrets: HashiCorp Vault
secrets:
  apiKeysSecretName: oss/api-keys
  postgresSecretName: oss/postgres
  minIOSecretName: oss/minio
  activeMQSecretName: oss/activemq
  mongoDbSecretName: oss/mongodb
  kafkaProducerSecretName: oss/kafka-producer
  qdrantSecretName: oss/qdrant
  weaviateSecretName: oss/weaviate
  milvusSecretName: oss/milvus
  chromaSecretName: oss/chroma
  pgvectorSecretName: oss/pgvector

# Queue + notifications: ActiveMQ
activemq:
  server: tcp://localhost:61616

# NoSQL: MongoDB
mongodb:
  connectionString: mongodb://localhost:27017
  database: oss

# SQL: PostgreSQL
postgres:
  database: datris

sendPipelineNotifications: "true"
ttlFileNotifierQueueMessages: "60"

# AI configuration — three independent, self-describing Vault secrets.
# Each secret carries its own provider, endpoint, model, apiKey, and (optionally) version,
# so the resolver never derives the path from a YAML provider field. Per-tenant overrides
# in multi-tenant mode live at {env}/ai-primary, {env}/codegen, {env}/embedding.
#
# vault-init.sh seeds all three based on which API key is set in .env:
#   - OPENAI_API_KEY    → all three point at OpenAI
#   - ANTHROPIC_API_KEY → ai-primary + codegen point at Anthropic; embedding falls back
#                          to the local ollama sidecar (bge-m3) so vector destinations
#                          work out of the box without an OpenAI key.
ai:
  enabled: "true"
  aiPrimary:
    secretName: "oss/ai-primary"
  codegen:
    secretName: "oss/codegen"
  embedding:
    secretName: "oss/embedding"

# Kafka consumer
kafkaConsumer:
  enabled: "true"
  bootstrapServers: localhost:9092
  groupId: oss-group
  topicPollingInterval: "500"
  topicPrefix: oss
