spring:
  servlet:
    multipart:
      max-file-size: 1GB
      max-request-size: 1GB
  server:
    tomcat:
      connection-timeout: "600000"
  data:
    mongodb:
      uri: mongodb://localhost:27017/datris

# Actuator: health probes plus the Prometheus scrape endpoint
# (/actuator/prometheus). Actuator endpoints carry no secrets but describe the
# runtime — nginx blocks /actuator from the outside; scrape it from inside the
# compose network (http://datris:8080/actuator/prometheus).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    ai.datris: INFO
schedule:
  checkFileNotifierQueue: "5000"
  findJobsToStart: "5000"
  checkDatabaseSourceQueries: "30000"
  checkTapSchedules: "30000"
  incidentSweep: "300000"  # recovery-agent sweep: resume approvals, stale/volume signals
tapScriptTimeoutSeconds: "300"
dateFormat: "yyyy-MM-dd HH:mm:ss z"
dateTimezone: "America/New_York"
environment: oss
useApiKeys: "false"
useUserAuth: "false"
multiTenant: "false"
# Durable audit log of who did what (admin-readable under Configuration →
# Audit Log). Off by default so existing deploys are unchanged; a restart is
# required to flip it. Env var: USE_AUDIT_LOG.
useAuditLog: "false"
auditLog:
  retentionDays: 90       # Mongo TTL on entries; 0 = never expire
  logReads: false         # also record query/search/metadata/GET routes (high volume)
  emitLogLine: true       # mirror each entry to logger ai.datris.audit (JSON under the production profile)
# Recovery agent: the platform opens incidents for final tap failures, failed
# pipeline jobs, stale scheduled taps and volume anomalies, diagnoses them with
# the Ops assistant's judgment, and — within the agent policy's recovery mode
# and limits — repairs and verifies them. Requires useAgentPolicy for its
# approval flow. Env vars: RECOVERY_AGENT_ENABLED, INCIDENT_WEBHOOK_URL.
recoveryAgent:
  enabled: "false"
  webhookUrl: ""          # optional JSON POST on open / awaiting_approval / resolved / failed

# Agent policy: per-action auto / approve / deny for agent-initiated requests,
# with a human approval queue (Configuration → Agent Policy, Activity →
# Approvals). Off by default; with it on and no policy saved, nothing changes
# until an admin sets an action to approve or deny. Env var: USE_AGENT_POLICY.
useAgentPolicy: "false"

# CORS allowed origins (comma-separated). Use "*" for any origin (dev only).
# Production: lock down to specific origins, e.g. "https://app.datris.ai,https://admin.datris.ai"
cors:
  allowedOrigins: "*"

# Object store: MinIO
minio:
  server: http://localhost:9000

# Secrets: HashiCorp Vault
secrets:
  apiKeysSecretName: oss/api-keys
  postgresSecretName: oss/postgres
  minIOSecretName: oss/minio
  activeMQSecretName: oss/activemq
  mongoDbSecretName: oss/mongodb
  kafkaProducerSecretName: oss/kafka-producer
  qdrantSecretName: oss/qdrant
  weaviateSecretName: oss/weaviate
  milvusSecretName: oss/milvus
  chromaSecretName: oss/chroma
  pgvectorSecretName: oss/pgvector

# Queue + notifications: ActiveMQ
activemq:
  server: tcp://localhost:61616

# NoSQL: MongoDB
mongodb:
  connectionString: mongodb://localhost:27017
  # User-facing database: pipelines write here, shown in the UI. Do not rename
  # after deployment without migrating the data.
  database: datris
  # Internal platform database: pipeline/tap configs, run status, etc. Never
  # surfaced in the UI. Kept on `oss` historically; do not change without
  # migrating the platform state collections.
  internalDatabase: oss

# SQL: PostgreSQL
postgres:
  database: datris

sendPipelineNotifications: "true"
ttlFileNotifierQueueMessages: "60"

# AI configuration — three independent, self-describing Vault secrets.
# Each secret carries its own provider, endpoint, model, apiKey, and (optionally) version,
# so the resolver never derives the path from a YAML provider field. Per-tenant overrides
# in multi-tenant mode live at {env}/ai-primary, {env}/codegen, {env}/embedding.
#
# vault-init.sh seeds all three based on which API key is set in .env:
#   - OPENAI_API_KEY    → all three point at OpenAI
#   - ANTHROPIC_API_KEY → ai-primary + codegen point at Anthropic; embedding falls back
#                          to the bundled embedding service (bge-m3) so vector destinations
#                          work out of the box without an OpenAI key.
hosted: "false"

ai:
  enabled: "true"
  aiPrimary:
    secretName: "oss/ai-primary"
  codegen:
    secretName: "oss/codegen"
  embedding:
    secretName: "oss/embedding"
  webSearch:
    secretName: "oss/web-search"
  # Enable extended thinking on the Assistant tab's agent loop. Anthropic-only —
  # surfaces the model's chain-of-thought above the visible response so the user
  # can watch it reason about which MCP tool to call next. Adds ~$0.05/turn and
  # ~2-8s latency on Opus. Set to "false" to disable platform-wide.
  extendedThinking: "true"

# Kafka consumer.
# Disabled by default since v1.6.15 — the bundled Kafka service is opt-in
# (commented out in docker-compose.yml). Flip enabled to "true" if you
# uncomment the Kafka block or point bootstrapServers at an external broker.
kafkaConsumer:
  enabled: "false"
  bootstrapServers: localhost:9092
  groupId: oss-group
  topicPollingInterval: "500"
  topicPrefix: oss
