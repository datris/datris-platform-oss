name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

env:
  DOCKERHUB_ORG: datrisai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Java 17 and SBT
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Install SBT via Coursier
        run: |
          curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > cs
          chmod +x cs
          # Pin the sbt launcher to 1.x (matches project/build.properties). Bare `--apps sbt`
          # now resolves sbt 2.x, which ignores build.properties for the meta-build and tries
          # to fetch our sbt 1.x plugins as sbt2_3 cross-versions (not found).
          ./cs setup --yes --apps sbt:1.12.5
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Build server JAR
        run: sbt clean assembly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push datris-server
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-server:latest

      - name: Build and push datris-ui
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-ui:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-ui:latest

      - name: Build and push datris-mcp-server
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:latest

      - name: Build and push datris-tap-runner
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./tap-runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-tap-runner:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-tap-runner:latest
