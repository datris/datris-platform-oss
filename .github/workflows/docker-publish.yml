name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

env:
  DOCKERHUB_ORG: datrisai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install SBT
        run: |
          echo "deb https://repo.scala-sbt.org/scalasbt/debian all main" | sudo tee /etc/apt/sources.list.d/sbt.list
          curl -sL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x2EE0EA64E40A89B84B2DF73499E82A75642AC823" | sudo apt-key add
          sudo apt-get update
          sudo apt-get install -y sbt

      - name: Build server JAR with SBT
        run: sbt clean assembly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push datris-server
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-server:latest

      - name: Build and push datris-ui
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-ui:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-ui:latest

      - name: Build and push datris-mcp-server
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:latest
