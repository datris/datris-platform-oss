name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

env:
  DOCKERHUB_ORG: datrisai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17 and SBT
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Install SBT via Coursier
        run: |
          curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > cs
          chmod +x cs
          # Pin the sbt launcher to 1.x (matches project/build.properties). Bare `--apps sbt`
          # now resolves sbt 2.x, which ignores build.properties for the meta-build and tries
          # to fetch our sbt 1.x plugins as sbt2_3 cross-versions (not found).
          ./cs setup --yes --apps sbt:1.12.5
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Build server JAR
        run: sbt clean test assembly

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Build and push datris-server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-server:latest

      - name: Build and push datris-ui
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./ui
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-ui:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-ui:latest

      - name: Build and push datris-mcp-server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./mcp-server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:latest

      - name: Build and push datris-tap-runner
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./tap-runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.DOCKERHUB_ORG }}/datris-tap-runner:${{ steps.tag.outputs.version }}
            ${{ env.DOCKERHUB_ORG }}/datris-tap-runner:latest

      # SBOMs (CycloneDX via Syft) for each published image, attached as workflow
      # artifacts — the distributable supply-chain artifact that the GitHub
      # dependency graph alerting does not provide.
      - name: Generate SBOM — datris-server
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DOCKERHUB_ORG }}/datris-server:${{ steps.tag.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-datris-server-${{ steps.tag.outputs.version }}.cdx.json
          artifact-name: sbom-datris-server-${{ steps.tag.outputs.version }}.cdx.json

      - name: Generate SBOM — datris-ui
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DOCKERHUB_ORG }}/datris-ui:${{ steps.tag.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-datris-ui-${{ steps.tag.outputs.version }}.cdx.json
          artifact-name: sbom-datris-ui-${{ steps.tag.outputs.version }}.cdx.json

      - name: Generate SBOM — datris-mcp-server
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DOCKERHUB_ORG }}/datris-mcp-server:${{ steps.tag.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-datris-mcp-server-${{ steps.tag.outputs.version }}.cdx.json
          artifact-name: sbom-datris-mcp-server-${{ steps.tag.outputs.version }}.cdx.json

      - name: Generate SBOM — datris-tap-runner
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.DOCKERHUB_ORG }}/datris-tap-runner:${{ steps.tag.outputs.version }}
          format: cyclonedx-json
          output-file: sbom-datris-tap-runner-${{ steps.tag.outputs.version }}.cdx.json
          artifact-name: sbom-datris-tap-runner-${{ steps.tag.outputs.version }}.cdx.json
