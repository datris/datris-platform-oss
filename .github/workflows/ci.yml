name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17 and SBT
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Install SBT via Coursier
        run: |
          curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > cs
          chmod +x cs
          # Pin the sbt launcher to 1.x (matches project/build.properties). Bare `--apps sbt`
          # now resolves sbt 2.x, which ignores build.properties for the meta-build and tries
          # to fetch our sbt 1.x plugins as sbt2_3 cross-versions (not found).
          ./cs setup --yes --apps sbt:1.12.5
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Format check and test
        run: sbt scalafmtCheckAll test
