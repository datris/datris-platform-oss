name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 17 and SBT
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'sbt'

      - name: Install SBT via Coursier
        run: |
          curl -fL "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux.gz" | gzip -d > cs
          chmod +x cs
          # Pin the sbt launcher to 1.x (matches project/build.properties). Bare `--apps sbt`
          # now resolves sbt 2.x, which ignores build.properties for the meta-build and tries
          # to fetch our sbt 1.x plugins as sbt2_3 cross-versions (not found).
          ./cs setup --yes --apps sbt:1.12.5
          echo "$HOME/.local/share/coursier/bin" >> $GITHUB_PATH

      - name: Format check and test
        run: sbt scalafmtCheckAll test

  # Builds the Angular UI so a dependency bump that breaks the UI (peer-dep
  # conflict on `npm ci`, or a build error) fails CI instead of merging green.
  # The `test` job above only covers the Scala server — a UI-breaking dep
  # (e.g. a zone.js/typescript bump past Angular's supported range) slipped
  # through before this existed.
  ui-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The MCP tool catalog exists on three hand-maintained surfaces
      # (mcp-server/server.py, auth/MCPToolRoutes.scala, the UI's MCP tab).
      # This fails the build when any of them drifts — a missing UI entry
      # silently hides the tool from the Connect tab (happened in v1.22).
      - name: MCP tool catalog drift check
        run: python3 scripts/check-mcp-tool-catalog.py

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install and build UI
        working-directory: ui
        run: |
          npm ci
          npm run build
