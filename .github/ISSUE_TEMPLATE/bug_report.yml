name: Bug Report
description: Report a bug or unexpected behavior in Datris
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues should NOT be filed here.** Please follow the disclosure process in [SECURITY.md](../../blob/main/SECURITY.md) instead.

  - type: input
    id: version
    attributes:
      label: Datris version
      description: Check the UI footer or run `docker images | grep datris`
      placeholder: "e.g. v1.6.15"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected component
      options:
        - Server (datrisserver)
        - MCP server
        - UI
        - CLI
        - Taps / ingestion
        - AI / CodeGen (DQ, transformations, agents)
        - Discovery / search
        - Docker / deployment
        - Docs (docs.datris.ai)
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment type
      options:
        - Local Docker Compose
        - Self-hosted (single VM)
        - Self-hosted (managed Postgres / cloud)
        - Datris hosted trial
        - Datris hosted dedicated
        - Other
    validations:
      required: true

  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client (if applicable)
      description: Only relevant if the bug involves the MCP server
      options:
        - Not applicable
        - Claude Desktop
        - Claude Code
        - Cursor
        - Other
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include CLI commands, API calls, or UI clicks as applicable.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Server logs, browser console, CLI output. Wrap in code fences if pasting inline.
      render: shell
    validations:
      required: false

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Docker version, anything else relevant
      placeholder: |
        - OS: macOS 14.5
        - Docker: 27.0
        - Browser: Chrome 130
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
