server {
    listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version in responses/error pages.
    server_tokens off;

    # Security headers. CSP frame-ancestors + X-Frame-Options block clickjacking;
    # nosniff stops MIME-type confusion; Referrer-Policy avoids leaking full URLs
    # (which can carry tokens) to third parties. Applied to every response.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://datris:8080;

    client_max_body_size 1G;

    error_page 413 @entity_too_large;
    location @entity_too_large {
        default_type application/json;
        return 413 '{"error": "File too large. Maximum upload size is 1 GB."}';
    }

    # Chat endpoints stream Server-Sent Events for as long as the agent loop
    # runs — one tool call (e.g. test_tap) can legitimately block for the full
    # tap script timeout. The server sends a heartbeat comment every 20s so
    # the stream is never silent, and this read timeout matches the server's
    # own 30-minute SSE emitter ceiling as a second line of defence. Buffering
    # is off so each event reaches the browser as it is written.
    location ~ ^/api/v1/(assistant|ops-chat|catalog-chat|search-chat)/chat$ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
    }

    location /api/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
