<div class="container">
  <h1 class="page-title">Pipeline Status</h1>
  <div class="header">
    <input type="text" placeholder="Search datasets..." />
  </div>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Dataset</th>
          <th>Current Process</th>
          <th>Start Time</th>
          <th>End Time</th>
          <th>Total Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let dataset of datasets" (click)="onRowClick(dataset.pipelineToken, dataset.dataset)">
          <td>{{ dataset.dataset }}</td>
          <td>{{ dataset.process }}</td>
          <td>{{ dataset.startTime }}</td>
          <td>{{ dataset.endTime }}</td>
          <td>{{ dataset.totalTime }}</td>
          <td>
            <span class="status-pill"
              [class.status-completed]="dataset.status === 'completed' || dataset.status === 'success'"
              [class.status-error]="dataset.status === 'error' || dataset.status === 'failed'"
              [class.status-processing]="dataset.status === 'processing' || dataset.status === 'running'"
              [class.status-pending]="dataset.status === 'pending' || dataset.status === 'queued'"
            >{{ dataset.status }}</span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <div class="pagination">
    <button (click)="onPreviousPage()" [disabled]="page === 1">Previous</button>
    <button (click)="onNextPage()">Next</button>
  </div>
</div>
