<div class="container">
  <a class="back-link" routerLink="/ingestion">&#8592; Back to Data Ingestion</a>
  <h1 class="dataset-title">{{ pipeline }}</h1>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 200px">Date</th>
          <th>Process</th>
          <th style="width: 300px">Publisher Token</th>
          <th style="width: 300px">Pipeline Token</th>
          <th>State</th>
          <th>Code</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let detail of pipelineStatusDetails">
          <td>{{ detail.dateTime }}</td>
          <td>{{ detail.processName }}</td>
          <td class="mono">{{ detail.publisherToken }}</td>
          <td class="mono">{{ detail.pipelineToken }}</td>
          <td>
            <span class="status-pill"
              [class.status-completed]="detail.state === 'completed' || detail.state === 'success'"
              [class.status-error]="detail.state === 'error' || detail.state === 'failed'"
              [class.status-processing]="detail.state === 'processing' || detail.state === 'running'"
              [class.status-pending]="detail.state === 'pending' || detail.state === 'queued'"
            >{{ detail.state }}</span>
          </td>
          <td class="mono">{{ detail.code }}</td>
          <td class="description-text">
            <span>{{ detail.description }}</span>
            <button class="copy-btn" *ngIf="detail.code === 'error' || detail.code === 'warning' || detail.description.includes('AI Explanation')"
              (click)="copyToClipboard(detail.description)" title="Copy to clipboard">
              <span class="material-icons copy-icon">content_copy</span>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
