<div class="container">
  <a class="back-link" routerLink="/pipelines">&#8592; Back to Datasets</a>
  <h1 class="dataset-title">Edit: {{ name }}</h1>

  <div class="form-card">
    <app-pipeline-config-form [(configJson)]="configJson" [error]="error"></app-pipeline-config-form>

    <div class="success-box" *ngIf="success">{{ success }}</div>

    <div class="btn-row">
      <button class="secondary-btn" routerLink="/pipelines">Cancel</button>
      <div class="spacer"></div>
      <button class="primary-btn" (click)="save()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Dataset' }}
      </button>
    </div>
  </div>
</div>
