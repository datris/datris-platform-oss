<div class="container">
  <a class="back-link" href="javascript:history.back()">&#8592; Back to Pipeline Status</a>
  <h1 class="dataset-title">{{ dataset }}</h1>
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 200px">Date</th>
          <th>Process</th>
          <th style="width: 300px">Publisher Token</th>
          <th style="width: 300px">Pipeline Token</th>
          <th>State</th>
          <th>Code</th>
          <th>Description</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let detail of datasetStatusDetails">
          <td>{{ detail.dateTime }}</td>
          <td>{{ detail.processName }}</td>
          <td class="mono">{{ detail.publisherToken }}</td>
          <td class="mono">{{ detail.pipelineToken }}</td>
          <td>
            <span class="status-pill"
              [class.status-completed]="detail.state === 'completed' || detail.state === 'success'"
              [class.status-error]="detail.state === 'error' || detail.state === 'failed'"
              [class.status-processing]="detail.state === 'processing' || detail.state === 'running'"
              [class.status-pending]="detail.state === 'pending' || detail.state === 'queued'"
            >{{ detail.state }}</span>
          </td>
          <td class="mono">{{ detail.code }}</td>
          <td class="description-text">{{ detail.description }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
