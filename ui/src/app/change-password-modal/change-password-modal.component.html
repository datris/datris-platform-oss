<div class="overlay">
  <div class="modal-card">
    <h2>{{ forced ? 'Set your password' : 'Change password' }}</h2>
    <p class="subtitle" *ngIf="forced">This account doesn't have a password yet. Set one to continue.</p>

    <form (ngSubmit)="submit()">
      <div class="input-row" *ngIf="!forced">
        <input
          [type]="showCurrent ? 'text' : 'password'"
          [(ngModel)]="currentPassword"
          name="currentPassword"
          placeholder="Current password"
          autocomplete="current-password"
        />
        <button type="button" class="reveal-btn" (click)="showCurrent = !showCurrent" [attr.aria-label]="showCurrent ? 'Hide password' : 'Show password'">
          <mat-icon>{{ showCurrent ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      <div class="input-row">
        <input
          [type]="showNew ? 'text' : 'password'"
          [(ngModel)]="newPassword"
          name="newPassword"
          placeholder="New password (min 5 chars)"
          autocomplete="new-password"
          autofocus
        />
        <button type="button" class="reveal-btn" (click)="showNew = !showNew" [attr.aria-label]="showNew ? 'Hide password' : 'Show password'">
          <mat-icon>{{ showNew ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      <div class="input-row">
        <input
          [type]="showConfirm ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          placeholder="Confirm new password"
          autocomplete="new-password"
        />
        <button type="button" class="reveal-btn" (click)="showConfirm = !showConfirm" [attr.aria-label]="showConfirm ? 'Hide password' : 'Show password'">
          <mat-icon>{{ showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>

      <div class="actions">
        <button type="button" class="btn-cancel" *ngIf="forced" (click)="signOut()">Sign out</button>
        <button type="button" class="btn-cancel" *ngIf="!forced" (click)="cancel.emit()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="loading">
          {{ loading ? 'Saving…' : (forced ? 'Set password' : 'Change password') }}
        </button>
      </div>
    </form>

    <p class="error" *ngIf="error">{{ error }}</p>
  </div>
</div>
