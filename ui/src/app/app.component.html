<app-api-key-prompt *ngIf="!hasApiKey && requiresApiKey && !useUserAuth" (keySet)="onApiKeySet()"></app-api-key-prompt>

<app-change-password-modal
  *ngIf="showSetPassword"
  [forced]="true"
  (done)="onPasswordSet()"
></app-change-password-modal>

<nav class="top-nav" *ngIf="showChrome()">
  <a routerLink="/"><img src="datris-full-logo.png" alt="Datris logo" class="logo"></a>
  <div class="tab-bar">
    <a class="tab" routerLink="/assistant" routerLinkActive="tab-active">Assistant</a>
    <a class="tab" routerLink="/mcp" routerLinkActive="tab-active">MCP</a>
    <a class="tab" routerLink="/catalog" routerLinkActive="tab-active">Catalog</a>
    <a class="tab" routerLink="/search" routerLinkActive="tab-active">Search</a>
    <a class="tab" routerLink="/ops" routerLinkActive="tab-active">Ops</a>
    <a class="tab" routerLink="/configuration" routerLinkActive="tab-active" *ngIf="!useUserAuth || isAdmin()">Configuration</a>
    <div class="help-menu">
      <button class="tab help-trigger" type="button" (click)="toggleHelpMenu($event)" [class.help-trigger-open]="helpMenuOpen">
        Help <span class="help-caret">▾</span>
      </button>
      <div class="help-menu-items" *ngIf="helpMenuOpen">
        <a class="help-menu-item" href="https://docs.datris.ai" target="_blank" rel="noopener">Docs ↗</a>
        <a class="help-menu-item" href="https://github.com/datris/datris-platform-oss/issues" target="_blank" rel="noopener">Support ↗</a>
      </div>
    </div>
  </div>
  <div class="env-info" *ngIf="environment">
    <div class="user-menu" *ngIf="useUserAuth && currentUser">
      <button class="user-icon-btn" (click)="toggleUserMenu($event)" title="Account">
        <mat-icon>person</mat-icon>
      </button>
      <div class="user-dropdown" *ngIf="userMenuOpen" (click)="$event.stopPropagation()">
        <div class="user-dropdown-header">
          <div class="user-dropdown-name">{{ currentUser.username }}</div>
          <div class="user-dropdown-role">{{ currentUser.role }}</div>
        </div>
        <button class="user-dropdown-item" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </div>
    </div>
    <span class="env-label">{{ environment }}</span>
    <span class="env-version">v{{ version }}</span>
  </div>
</nav>

<main class="main-content" [class.no-chrome]="!showChrome()">
  <router-outlet />
</main>
