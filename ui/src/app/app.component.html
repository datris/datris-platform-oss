<app-api-key-prompt *ngIf="!hasApiKey && requiresApiKey" (keySet)="onApiKeySet()"></app-api-key-prompt>
<ng-container *ngIf="hasApiKey">
  <nav class="top-nav">
    <a routerLink="/"><img src="datris-full-logo.png" alt="Datris logo" class="logo"></a>
    <div class="tab-bar">
      <a class="tab" routerLink="/getting-started" routerLinkActive="tab-active">Getting Started</a>
      <a class="tab" routerLink="/mcp" routerLinkActive="tab-active">MCP</a>
      <a class="tab" routerLink="/agent-monitor" routerLinkActive="tab-active">Agents</a>
      <a class="tab" routerLink="/data-catalog" routerLinkActive="tab-active">Data Catalog</a>
      <a class="tab" routerLink="/discovery" routerLinkActive="tab-active">Discovery</a>
      <a class="tab" routerLink="/taps" routerLinkActive="tab-active">Taps</a>
      <a class="tab" routerLink="/pipelines" routerLinkActive="tab-active">Pipelines</a>
      <a class="tab" routerLink="/ingestion" routerLinkActive="tab-active">Ingestion</a>
      <a class="tab" routerLink="/search" routerLinkActive="tab-active">Search</a>
      <a class="tab" routerLink="/configuration" routerLinkActive="tab-active">Configuration</a>
      <div class="help-menu">
        <button class="tab help-trigger" type="button" (click)="toggleHelpMenu($event)" [class.help-trigger-open]="helpMenuOpen">
          Help <span class="help-caret">▾</span>
        </button>
        <div class="help-menu-items" *ngIf="helpMenuOpen">
          <a class="help-menu-item" href="https://docs.datris.ai" target="_blank" rel="noopener">Docs ↗</a>
          <a class="help-menu-item" href="https://github.com/datris/datris-platform-oss/issues" target="_blank" rel="noopener">Support ↗</a>
        </div>
      </div>
    </div>
    <div class="env-info" *ngIf="environment">
      <span class="env-label">{{ environment }}</span>
      <span class="env-version">v{{ version }}</span>
    </div>
  </nav>
  <main class="main-content">
    <router-outlet />
  </main>
</ng-container>
