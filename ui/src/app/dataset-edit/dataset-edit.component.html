<div class="container">
  <a class="back-link" routerLink="/datasets">&#8592; Back to Datasets</a>
  <h1 class="dataset-title">Edit: {{ name }}</h1>

  <div class="form-card">
    <div class="form-row">
      <label class="form-label">Dataset Configuration</label>
      <textarea class="form-input form-textarea config-editor" [(ngModel)]="configJson" rows="25"></textarea>
    </div>

    <div class="success-box" *ngIf="success">{{ success }}</div>
    <div class="error-box" *ngIf="error">{{ error }}</div>

    <div class="btn-row">
      <button class="secondary-btn" routerLink="/datasets">Cancel</button>
      <div class="spacer"></div>
      <button class="primary-btn" (click)="save()" [disabled]="saving">
        {{ saving ? 'Saving...' : 'Save Dataset' }}
      </button>
    </div>
  </div>
</div>
