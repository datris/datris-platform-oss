<div class="container">
  <div class="page-header">
    <h1 class="page-title">Datasets</h1>
    <button class="create-btn" routerLink="/datasets/create">+ Create Dataset</button>
  </div>

  <div class="table-container" *ngIf="datasets.length > 0">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Source</th>
          <th>Destinations</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ds of datasets" (click)="viewDataset(ds.name)">
          <td class="dataset-name">{{ ds.name }}</td>
          <td>{{ getSourceType(ds) }}</td>
          <td>{{ getDestinations(ds) }}</td>
          <td class="actions-cell">
            <button class="delete-btn" (click)="deleteDataset($event, ds.name)" title="Delete dataset"><span class="material-icons">delete</span></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="datasets.length === 0">
    <p>No datasets registered. Use the API or MCP server to create one.</p>
  </div>
</div>
