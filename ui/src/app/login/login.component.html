<div class="overlay" *ngIf="ready">
  <div class="prompt-card">
    <img src="datris-full-logo.png" alt="Datris" class="logo">
    <h2>Sign in</h2>
    <p class="subtitle">Use your Datris account to access this instance.</p>

    <form (ngSubmit)="submit()">
      <input
        type="text"
        [(ngModel)]="username"
        name="username"
        placeholder="Username"
        autocomplete="username"
        autofocus
      />
      <div class="input-row">
        <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          placeholder="Password (leave blank if first login)"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="reveal-btn"
          (click)="showPassword = !showPassword"
          [title]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </div>
      <button type="submit" class="connect-btn" [disabled]="loading">
        {{ loading ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>

    <p class="error" *ngIf="error">{{ error }}</p>
    <p class="hint">Default account is <code>admin</code> with no password — you'll be asked to set one on first login.</p>
  </div>
</div>
