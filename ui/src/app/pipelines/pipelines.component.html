<div class="container">
  <div class="page-header">
    <h1 class="page-title">Pipelines</h1>
    <button class="create-btn" routerLink="/pipelines/create">+ Create Pipeline</button>
  </div>

  <div class="table-container" *ngIf="pipelines.length > 0">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Source</th>
          <th>Destinations</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ds of pipelines" (click)="viewPipeline(ds.name)">
          <td class="dataset-name">{{ ds.name }}</td>
          <td>{{ getSourceType(ds) }}</td>
          <td>{{ getDestinations(ds) }}</td>
          <td class="actions-cell">
            <button class="action-btn edit-btn" (click)="editPipeline($event, ds.name)" title="Edit pipeline"><span class="material-icons">edit</span></button>
            <button class="action-btn delete-btn" (click)="promptDelete($event, ds.name)" title="Delete pipeline" *ngIf="deleteTarget !== ds.name"><span class="material-icons">delete</span></button>
            <div class="delete-menu" *ngIf="deleteTarget === ds.name" (click)="$event.stopPropagation()">
              <button class="del-opt del-all" (click)="confirmDelete($event, true)" title="Delete config and data">
                <span class="material-icons">delete_forever</span> Config & Data
              </button>
              <button class="del-opt del-data" (click)="confirmDelete($event, false)" title="Delete data only">
                <span class="material-icons">cleaning_services</span> Data Only
              </button>
              <button class="del-opt del-cancel" (click)="cancelDelete($event)" title="Cancel">
                <span class="material-icons">close</span>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="empty-state" *ngIf="pipelines.length === 0">
    <p>No pipelines registered. Use the API or MCP server to create one.</p>
  </div>
</div>
