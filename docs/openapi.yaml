openapi: 3.0.3
info:
  title: Datris API
  description: |
    REST API for the Datris AI Data Platform. Ingest, validate, transform, store, and retrieve data.

    For AI agent integration, use the [MCP Server](https://github.com/datris/datris-platform-oss/blob/main/docs/mcp.md) instead.
  version: 1.0.0
  contact:
    name: Datris
    url: https://datris.ai
  license:
    name: Apache 2.0

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Optional API key for authentication (enabled via application.yaml)

  schemas:
    QueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        count:
          type: integer

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              chunk_index:
                type: integer
              source_dataset:
                type: string
              filename:
                type: string
              _score:
                type: number
        count:
          type: integer

    VersionResponse:
      type: object
      properties:
        version:
          type: string

    KillJobResponse:
      type: object
      properties:
        status:
          type: string
          example: cancelled
        pipelineToken:
          type: string

    ColumnInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string

    AiAnswerRequest:
      type: object
      required: [query, context]
      properties:
        query:
          type: string
          description: The question to answer
        context:
          type: string
          description: Context text to base the answer on (e.g., retrieved document chunks)

    AiAnswerResponse:
      type: object
      properties:
        answer:
          type: string

    ConfigUploadResponse:
      type: object
      properties:
        filename:
          type: string
        path:
          type: string

paths:
  # ── Pipeline Management ──────────────────────────────────────

  /api/v1/pipeline:
    get:
      tags: [Pipelines]
      summary: Get a pipeline configuration
      parameters:
        - name: pipeline
          in: query
          required: true
          schema:
            type: string
          description: Pipeline name
      responses:
        '200':
          description: Pipeline configuration
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

    post:
      tags: [Pipelines]
      summary: Create or update a pipeline configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Pipeline name
                source:
                  type: object
                  description: Source configuration (fileAttributes, schemaProperties)
                preprocessor:
                  type: object
                  description: Optional REST endpoint preprocessor
                dataQuality:
                  type: object
                  description: Data quality rules (AI rules, column rules, row rules, schema validation)
                transformation:
                  type: object
                  description: Transformation rules (deduplication, trimming, AI transforms, row functions)
                destination:
                  type: object
                  description: Destination configuration (database, objectStore, kafka, activeMQ, restEndpoint, qdrant, weaviate, milvus, chroma, pgvector)
      responses:
        '200':
          description: Pipeline created/updated
        '500':
          description: Error

    delete:
      tags: [Pipelines]
      summary: Delete a pipeline configuration
      parameters:
        - name: pipeline
          in: query
          required: true
          schema:
            type: string
          description: Pipeline name to delete
      responses:
        '200':
          description: Pipeline deleted
        '500':
          description: Error

  /api/v1/pipelines:
    get:
      tags: [Pipelines]
      summary: List all pipeline configurations
      responses:
        '200':
          description: Array of pipeline configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Error

  # ── File Upload & AI ────────────────────────────────────────

  /api/v1/pipeline/upload:
    post:
      tags: [Ingestion]
      summary: Upload a file for processing
      description: Upload a data file to a registered pipeline. Returns a pipeline token for tracking job status.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, pipeline]
              properties:
                file:
                  type: string
                  format: binary
                  description: Data file to upload
                pipeline:
                  type: string
                  description: Name of the registered pipeline
                publishertoken:
                  type: string
                  description: Optional publisher identifier
      responses:
        '200':
          description: Pipeline token (for uncompressed files) or empty (for compressed files)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Error

  /api/v1/pipeline/generate:
    post:
      tags: [AI]
      summary: AI schema generation
      description: Upload a file and receive an AI-generated pipeline configuration with inferred field names and types.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Sample data file (CSV, JSON, or XML)
                pipeline:
                  type: string
                  description: Pipeline name for the generated configuration
                delimiter:
                  type: string
                  description: CSV delimiter (default comma)
                header:
                  type: boolean
                  description: Whether CSV has a header row (default true)
      responses:
        '200':
          description: AI-generated pipeline configuration
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

  /api/v1/pipeline/profile:
    post:
      tags: [AI]
      summary: AI data profiling
      description: Upload a file and receive AI-generated summary statistics, quality issues, and suggested validation rules.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Data file to profile
                delimiter:
                  type: string
                  description: CSV delimiter (default comma)
                header:
                  type: boolean
                  description: Whether CSV has a header row (default true)
                sampleSize:
                  type: integer
                  description: Number of rows to sample (default 200)
      responses:
        '200':
          description: AI-generated data profile
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

  # ── Status ──────────────────────────────────────────────────

  /api/v1/pipeline/status:
    get:
      tags: [Status]
      summary: Get job status
      description: Query job status by pipeline token or pipeline name. Returns detailed status when queried by token, or paginated summary when queried by pipeline name.
      parameters:
        - name: pipelinetoken
          in: query
          schema:
            type: string
          description: Pipeline token from upload
        - name: pipelinename
          in: query
          schema:
            type: string
          description: Pipeline name for summary view
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for paginated results
      responses:
        '200':
          description: Job status information
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Error

  # ── Query ───────────────────────────────────────────────────

  /api/v1/query/postgres:
    post:
      tags: [Query]
      summary: Query PostgreSQL
      description: Execute a read-only SQL SELECT query against PostgreSQL. Enforces SELECT-only, blocks dangerous keywords, and auto-appends LIMIT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: SQL SELECT query to execute
                  example: "SELECT * FROM test.stock_price WHERE volume > 1000000"
                database:
                  type: string
                  default: datris
                  description: PostgreSQL database name
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return (max 1000)
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error

  /api/v1/query/mongodb:
    post:
      tags: [Query]
      summary: Query MongoDB
      description: Query a MongoDB collection with optional filter and projection. Blocks $where and $function operators.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection:
                  type: string
                  description: MongoDB collection name
                filter:
                  type: object
                  default: {}
                  description: MongoDB query filter
                projection:
                  type: object
                  description: Fields to include/exclude
                limit:
                  type: integer
                  default: 20
                  description: Maximum documents to return (max 1000)
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error

  /api/v1/job/kill:
    post:
      tags: [Status]
      summary: Kill a running job
      description: Interrupt and cancel a running pipeline job by its pipeline token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipelineToken]
              properties:
                pipelineToken:
                  type: string
                  description: Pipeline token of the running job
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillJobResponse'
        '500':
          description: Error (job not found, not running, or thread not alive)

  # ── Vector Search ───────────────────────────────────────────

  /api/v1/search/qdrant:
    post:
      tags: [Search]
      summary: Semantic search — Qdrant
      description: Search a Qdrant vector database collection using natural language. Generates an embedding from the query and returns the most similar document chunks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                collection:
                  type: string
                  default: financial_documents
                  description: Qdrant collection name
                embeddingSecretName:
                  type: string
                  description: Vault secret name for embedding provider (optional, uses server default if omitted)
                qdrantSecretName:
                  type: string
                  description: Vault secret name for Qdrant connection
                topK:
                  type: integer
                  default: 5
                  description: Number of results to return
      responses:
        '200':
          description: Search results with similarity scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Error

  /api/v1/search/weaviate:
    post:
      tags: [Search]
      summary: Semantic search — Weaviate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                className:
                  type: string
                  default: FinancialDocuments
                  description: Weaviate class name (PascalCase)
                embeddingSecretName:
                  type: string
                  description: Vault secret name for embedding provider (optional, uses server default if omitted)
                weaviateSecretName:
                  type: string
                  description: Vault secret name for Weaviate connection
                topK:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Error

  /api/v1/search/milvus:
    post:
      tags: [Search]
      summary: Semantic search — Milvus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                collection:
                  type: string
                  default: financial_documents
                  description: Milvus collection name
                embeddingSecretName:
                  type: string
                  description: Vault secret name for embedding provider (optional, uses server default if omitted)
                milvusSecretName:
                  type: string
                  description: Vault secret name for Milvus connection
                topK:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Error

  /api/v1/search/chroma:
    post:
      tags: [Search]
      summary: Semantic search — Chroma
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                collection:
                  type: string
                  default: financial_documents
                  description: Chroma collection name
                embeddingSecretName:
                  type: string
                  description: Vault secret name for embedding provider (optional, uses server default if omitted)
                chromaSecretName:
                  type: string
                  description: Vault secret name for Chroma connection
                topK:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Error

  /api/v1/search/pgvector:
    post:
      tags: [Search]
      summary: Semantic search — pgvector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                table:
                  type: string
                  default: financial_documents
                  description: PostgreSQL table name
                schema:
                  type: string
                  default: public
                  description: PostgreSQL schema
                embeddingSecretName:
                  type: string
                  description: Vault secret name for embedding provider (optional, uses server default if omitted)
                postgresSecretName:
                  type: string
                  description: Vault secret name for PostgreSQL/pgvector connection
                topK:
                  type: integer
                  default: 5
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '500':
          description: Error

  # ── Version ─────────────────────────────────────────────────

  /api/v1/version:
    get:
      tags: [Status]
      summary: Get server version
      responses:
        '200':
          description: Server version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '500':
          description: Error

  # ── Metadata Discovery ────────────────────────────────────

  /api/v1/metadata/postgres/databases:
    get:
      tags: [Metadata]
      summary: List PostgreSQL databases
      description: List all PostgreSQL databases available in the platform.
      responses:
        '200':
          description: Array of database names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/schemas:
    get:
      tags: [Metadata]
      summary: List PostgreSQL schemas
      description: List all schemas in a PostgreSQL database.
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
      responses:
        '200':
          description: Array of schema names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/tables:
    get:
      tags: [Metadata]
      summary: List PostgreSQL tables
      description: List all tables in a PostgreSQL schema. Set vectorOnly to true to filter to tables with an embedding column (pgvector tables).
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
        - name: schema
          in: query
          schema:
            type: string
            default: public
          description: Schema name
        - name: vectorOnly
          in: query
          schema:
            type: string
            default: "false"
          description: If "true", only return tables with an embedding column
      responses:
        '200':
          description: Array of table names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/columns:
    get:
      tags: [Metadata]
      summary: List table columns
      description: List all columns and their data types for a specific PostgreSQL table.
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
        - name: schema
          in: query
          schema:
            type: string
            default: public
          description: Schema name
        - name: table
          in: query
          required: true
          schema:
            type: string
          description: Table name
      responses:
        '200':
          description: Array of column definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnInfo'
        '500':
          description: Error

  /api/v1/metadata/mongodb/databases:
    get:
      tags: [Metadata]
      summary: List MongoDB databases
      description: List all MongoDB databases available in the platform. Excludes system databases (admin, config, local).
      responses:
        '200':
          description: Array of database names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/mongodb/collections:
    get:
      tags: [Metadata]
      summary: List MongoDB collections
      description: List MongoDB collections. If database is specified, lists collections in that database. Otherwise lists all collections across all databases in "db.collection" format.
      parameters:
        - name: database
          in: query
          schema:
            type: string
          description: Database name (optional; omit to list from all databases)
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  # ── Vector Store Metadata ──────────────────────────────────

  /api/v1/metadata/qdrant/collections:
    get:
      tags: [Metadata]
      summary: List Qdrant collections
      description: List all collections in the Qdrant vector database. Returns an empty array if Qdrant is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/weaviate/classes:
    get:
      tags: [Metadata]
      summary: List Weaviate classes
      description: List all classes in the Weaviate vector database. Returns an empty array if Weaviate is not configured.
      responses:
        '200':
          description: Array of class names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/milvus/collections:
    get:
      tags: [Metadata]
      summary: List Milvus collections
      description: List all collections in the Milvus vector database. Returns an empty array if Milvus is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/chroma/collections:
    get:
      tags: [Metadata]
      summary: List Chroma collections
      description: List all collections in the Chroma vector database. Returns an empty array if Chroma is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  # ── AI Answer ──────────────────────────────────────────────

  /api/v1/ai/answer:
    post:
      tags: [AI]
      summary: AI-powered question answering
      description: Use AI to answer a question based on provided context. Ideal for RAG workflows — retrieve relevant chunks via vector search, then pass them as context along with the user's question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnswerRequest'
      responses:
        '200':
          description: AI-generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnswerResponse'
        '500':
          description: Error

  # ── Configuration ──────────────────────────────────────────

  /api/v1/config/upload:
    post:
      tags: [Configuration]
      summary: Upload a configuration file
      description: Upload a JSON Schema (for pipeline dataQuality schema validation) or JavaScript file (for pipeline transformation row functions) to storage. The uploaded file can then be referenced by pipeline configurations.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [validation-schema, javascript]
                  description: "Config file type: 'validation-schema' for JSON Schema or 'javascript' for transformation scripts"
                file:
                  type: string
                  format: binary
                  description: Configuration file to upload
      responses:
        '200':
          description: Upload confirmation with storage path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUploadResponse'
        '500':
          description: Error

  # ── Health Check ───────────────────────────────────────────

  /api/v1/health/services:
    get:
      tags: [Health]
      summary: Check backend service health
      description: Returns the health status of all configured backend services including PostgreSQL, MongoDB, MinIO, ActiveMQ, Kafka, and vector databases (Qdrant, Weaviate, Milvus, Chroma, pgvector). Each service reports "up", "down", or "not_configured".
      responses:
        '200':
          description: Service health status map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [up, down, not_configured]
                    message:
                      type: string
              example:
                postgres:
                  status: up
                  message: Connected
                mongodb:
                  status: up
                  message: Connected
                qdrant:
                  status: not_configured
        '500':
          description: Error

  # ── Secrets ──────────────────────────────────────────────

  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List all secrets
      description: Lists all secret names under the current environment path in Vault.
      responses:
        '200':
          description: Array of secret names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["postgres", "mongodb", "embedding", "qdrant"]
        '500':
          description: Error

  /api/v1/secrets/{name}:
    get:
      tags: [Secrets]
      summary: Get secret details
      description: Returns the key-value fields of a secret. Sensitive fields (password, apiKey, secretKey, token) are masked unless reveal=true.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reveal
          in: query
          schema:
            type: string
            default: "false"
      responses:
        '200':
          description: Secret details with fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
        '404':
          description: Secret not found
        '500':
          description: Error
    put:
      tags: [Secrets]
      summary: Create or update a secret
      description: Creates or updates a secret with the provided key-value fields.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Success
        '500':
          description: Error
    delete:
      tags: [Secrets]
      summary: Delete a secret
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '500':
          description: Error

  # ── Schema Generation ────────────────────────────────────

  /api/v1/config/generate-schema:
    post:
      tags: [Configuration]
      summary: AI-generate a validation schema
      description: Uses AI to generate a JSON Schema (Draft 4) or W3C XSD from sample data. The schema is stored in MinIO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, sampleData]
              properties:
                type:
                  type: string
                  enum: [json-schema, xsd]
                name:
                  type: string
                sampleData:
                  type: string
      responses:
        '200':
          description: Generated schema with filename and content
          content:
            application/json:
              schema:
                type: object
                properties:
