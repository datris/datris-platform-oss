openapi: 3.0.3
info:
  title: Datris API
  description: |
    REST API for the Datris AI Data Platform. Ingest, validate, transform, store, and retrieve data.

    For AI agent integration, use the [MCP Server](https://docs.datris.ai/mcp-server) instead.
  version: 1.11.3
  contact:
    name: Datris
    url: https://datris.ai
  license:
    name: Apache 2.0

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - ApiKeyAuth: []

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Optional API key for authentication (enabled via application.yaml)

  schemas:
    QueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
        count:
          type: integer

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              chunk_index:
                type: integer
              source_pipeline:
                type: string
              filename:
                type: string
              _score:
                type: number
        count:
          type: integer

    VersionResponse:
      type: object
      properties:
        version:
          type: string
        environment:
          type: string
          description: Environment name (e.g., oss for self-hosted, or tenant prefix for managed hosting)
        multiTenant:
          type: string
          description: Whether the server is running in multi-tenant mode (true/false)

    KillJobResponse:
      type: object
      properties:
        status:
          type: string
          example: cancelled
        pipelineToken:
          type: string

    ColumnInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string

    AiAnswerRequest:
      type: object
      required: [query, context]
      properties:
        query:
          type: string
          description: The question to answer
        context:
          type: string
          description: Context text to base the answer on (e.g., retrieved document chunks)

    AiAnswerResponse:
      type: object
      properties:
        answer:
          type: string

    ConfigUploadResponse:
      type: object
      properties:
        filename:
          type: string
        path:
          type: string

    TapDetail:
      description: >-
        Response shape of `GET /api/v1/tap?name=...`. Extends `TapConfig` with
        the script content fetched from MinIO and a `scriptMissing` flag set
        when the tap has a `scriptPath` but the object is absent from storage
        (e.g. deleted during an interrupted edit or re-generation). Use this
        flag in UIs to distinguish "never generated" (script null, flag absent)
        from "object vanished" (script null, `scriptMissing: true`).
      allOf:
        - $ref: '#/components/schemas/TapConfig'
        - type: object
          properties:
            script:
              type: string
              nullable: true
              description: Python script body fetched from MinIO. Null when the tap has no script yet or when the script object is missing.
            scriptMissing:
              type: boolean
              description: Present and `true` only when `scriptPath` is set but the storage read returned no object. Omitted otherwise.

    TapConfig:
      type: object
      required: [name, description, targetPipeline]
      properties:
        name:
          type: string
          description: Unique tap identifier
        description:
          type: string
          description: Plain-English instruction used to generate the script
        scriptPath:
          type: string
          description: MinIO path of the generated Python script (built-in storage)
        scriptStorage:
          type: string
          enum: [minio, github]
          description: Script storage backend. Absent or `minio` = built-in object storage; `github` = the tenant's configured code repository.
        scriptRepoPath:
          type: string
          description: Repo-relative script path when `scriptStorage` is `github`
        scriptCommitSha:
          type: string
          description: Commit SHA the script is pinned to when `scriptStorage` is `github`; runs read exactly this commit
        scriptKind:
          type: string
          enum: [python, http]
          description: Tap implementation kind. Absent or `python` = a script the platform executes; `http` = a user-hosted endpoint speaking the tap HTTP contract (`endpointUrl` is authoritative; script/packages fields do not apply).
        endpointUrl:
          type: string
          description: For `scriptKind` `http` only — absolute http(s) URL Datris POSTs the run context to on each run
        targetPipeline:
          type: string
          description: Pipeline this tap feeds into (may be empty for unattached taps)
        packages:
          type: array
          items:
            type: string
          description: Extra pip packages required by the script
        secretName:
          type: string
          description: Name of the tap secret (Vault) injected as env vars at runtime
        cronExpression:
          type: string
          description: Quartz CRON expression for scheduled runs (omit for manual-only)
        enabled:
          type: boolean
          default: true
        tapType:
          type: string
          enum: [structured, document]
          default: structured
          description: >-
            `structured` (default) — the script returns records that flow into a
            structured pipeline destination.
            `document` — the script returns `{uri, filename, content}` dicts
            destined for a vector-store pipeline (unstructured source +
            qdrant/pgvector/weaviate/milvus/chroma destination). The server
            rejects a document tap pointed at an incompatible pipeline with
            HTTP 400. Document taps also use a per-URI ledger so each file is
            processed once across re-runs.
        lastRunStatus:
          type: string
          enum: [success, failure]
        lastRunTime:
          type: string
        lastRunRecordCount:
          type: integer
        lastRunError:
          type: string
        lastRunDataType:
          type: string
          enum: [csv, json, xml, text, document]
        lastRunColumns:
          type: array
          items:
            type: string
        lastTestRunStatus:
          type: string
        lastTestRunTime:
          type: string
        lastTestRunRecordCount:
          type: integer
        lastTestRunError:
          type: string
        lastTestRunDataType:
          type: string
        lastTestRunColumns:
          type: array
          items:
            type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    TapRunLog:
      type: object
      properties:
        tapName:
          type: string
        runTime:
          type: string
        status:
          type: string
          enum: [success, failure]
        recordCount:
          type: integer
        dataType:
          type: string
        logs:
          type: string
        error:
          type: string
        mode:
          type: string
          enum: [run, test]
          description: "'run' = results persisted to the target pipeline; 'test' = script executed, results discarded"
        durationMs:
          type: integer
          format: int64
        scriptCommitSha:
          type: string
          description: Repo-backed taps only — the commit the run's script was read at

    CodeRepoConfig:
      type: object
      properties:
        name:
          type: string
          description: Always `default` — one repository per tenant
        provider:
          type: string
          description: Repository provider (`github`)
        repo:
          type: string
          description: Repository in `owner/repo` form
        apiBaseUrl:
          type: string
          description: API endpoint; override for GitHub Enterprise Server (e.g. `https://ghes.example.com/api/v3`)
        branch:
          type: string
        pathPrefix:
          type: string
          description: Script path becomes `{pathPrefix}{tapName}.py`
        authSecretName:
          type: string
          description: Vault secret (tagged `_type=repo_token`) holding a `token` field. The token itself is never returned by the API.
        commitAuthor:
          type: string
          description: Commit author in `Name <email>` form
        commitMessageTemplate:
          type: string
          description: "Commit message template. Tokens: {name}, {action}, {user}"
        enabled:
          type: boolean

    TapRunResult:
      type: object
      properties:
        tap:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [success, failure]
        mode:
          type: string
          enum: [run, test]
          description: The mode this invocation ran in
        targetPipeline:
          type: string
          nullable: true
          description: The pipeline configured on the tap (null if none — records will not persist)
        persisted:
          type: boolean
          description: True iff records were fed into the target pipeline
        persistedReason:
          type: string
          enum: [test_mode, run_error, no_records, no_target_pipeline]
          description: Present when persisted is false; explains why records did not land in a pipeline
        publisherToken:
          type: string
          description: UUID grouping every ingestion job this run submitted. Pass to GET /pipeline/status?publishertoken= to watch load progress. Only present on persisted runs.
        pipelineTokens:
          type: array
          items:
            type: string
          description: UUIDs for each StreamNotifier job submitted. Length 1 for structured taps, N for document taps (one per document). Only present on persisted runs.
        records:
          type: array
          items:
            type: object
        recordCount:
          type: integer
        dataType:
          type: string
        columns:
          type: array
          items:
            type: string
        logs:
          type: string
        error:
          type: string
        aiExplanation:
          type: string

    TapBrainstormRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
        currentDescription:
          type: string
          description: Current draft instruction (optional context for the AI)
        tapType:
          type: string
          enum: [structured, document]
          default: structured
          description: Selects the system prompt. `document` keeps the brainstorm focused on document discovery (where files live, how to enumerate) and stops it asking about chunking, embedding, or vector-store choices.

    TapDocumentLedgerEntry:
      type: object
      properties:
        uri:
          type: string
          description: Unique source identifier for the document
        tapName:
          type: string
        stagedPath:
          type: string
          description: MinIO key where the raw bytes were staged
        filename:
          type: string
        contentHash:
          type: string
        firstSeenAt:
          type: string
        lastSeenAt:
          type: string
        status:
          type: string
          enum: [staged, processed, failed]
        metadata:
          type: object
          additionalProperties:
            type: string

    TapBrainstormResponse:
      type: object
      properties:
        reply:
          type: string
          description: The AI's next chat message
        description:
          type: string
          description: Updated draft instruction the UI should sync into the instruction box
        suggestedEnvVars:
          type: array
          items:
            type: string
          description: Environment variable names the script will need (excludes platform-injected DATRIS_* vars)

    TapPromptFragment:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Data-source key that triggers injection (e.g. a provider or API name)
        aliases:
          type: array
          items:
            type: string
          description: Alternate names that also trigger this fragment
        content:
          type: string
          description: Fragment text appended to the tap code-generation system prompt when the key/alias matches
        enabled:
          type: boolean
          default: true
        createdAt:
          type: string
        updatedAt:
          type: string

    ChatRequest:
      type: object
      required: [messages]
      properties:
        messages:
          type: array
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
        maxIterations:
          type: integer
          default: 50
          description: Maximum agent-loop iterations (LLM + tool-call rounds) before the loop stops
        context:
          type: object
          description: Optional endpoint-specific context object (see each chat endpoint's description)

    EntityVersionSummary:
      type: object
      properties:
        version:
          type: integer
        createdAt:
          type: string
        createdBy:
          type: string
          description: Who saved this version (user, API key label, or agent identity)
        changeNote:
          type: string

    EntityVersionSnapshot:
      allOf:
        - $ref: '#/components/schemas/EntityVersionSummary'
        - type: object
          properties:
            scriptPath:
              type: string
              nullable: true
              description: Storage path of the tap script pinned to this version (taps only)
            config:
              type: object
              description: The full configuration as saved at this version
            script:
              type: string
              nullable: true
              description: Resolved tap script content (taps only; null if the object is absent)

    EntityVersionDiff:
      type: object
      properties:
        from:
          type: integer
          description: Base version of the comparison (the `against` parameter)
        to:
          type: integer
          description: Target version of the comparison (the `version` parameter)
        config:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              before:
                type: string
              after:
                type: string
              change:
                type: string
        script:
          type: object
          description: Script diff (taps only)
          properties:
            before:
              type: string
            after:
              type: string
            lines:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  text:
                    type: string

paths:
  # ── Pipeline Management ──────────────────────────────────────

  /api/v1/pipeline:
    get:
      tags: [Pipelines]
      summary: Get a pipeline configuration
      parameters:
        - name: pipeline
          in: query
          required: true
          schema:
            type: string
          description: Pipeline name
      responses:
        '200':
          description: Pipeline configuration
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

    post:
      tags: [Pipelines]
      summary: Create or update a pipeline configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: Pipeline name
                source:
                  type: object
                  description: Source configuration (fileAttributes, schemaProperties)
                preprocessor:
                  type: object
                  description: Optional REST endpoint preprocessor
                dataQuality:
                  type: object
                  description: Data quality rules (AI rules, header validation, schema validation)
                transformation:
                  type: object
                  description: Transformation rules (AI transformation, deduplication, trimming)
                destination:
                  type: object
                  description: |
                    Destination configuration (database, objectStore, kafka, activeMQ, restEndpoint, qdrant, weaviate, milvus, chroma, pgvector).

                    The database destination selects its engine with exactly one of `usePostgres`, `useMongoDB`, `useSnowflake`, or `useDatabricks`. Snowflake and Databricks additionally take `credentialsSecret` (a Platform secret) and `warehouse` (Snowflake warehouse name / Databricks SQL warehouse ID); for Databricks, `dbName` names the Unity Catalog catalog.

                    objectStore supports two providers via the `provider` field: `minio` (default, uses the built-in MinIO credentials) and `s3` (AWS S3). For `provider: s3`, set `destinationBucketOverride` (required), `credentialsSecret` (Vault secret with `accessKey`/`secretKey`/`region` and optional `sessionToken`), and optionally `endpoint` (must be https://). Region lives in the credentials secret, not on the objectStore config.
      responses:
        '200':
          description: Pipeline created/updated
        '500':
          description: Error

    delete:
      tags: [Pipelines]
      summary: Delete a pipeline configuration
      parameters:
        - name: pipeline
          in: query
          required: true
          schema:
            type: string
          description: Pipeline name to delete
        - name: deleteData
          in: query
          required: false
          schema:
            type: string
            default: "true"
          description: Delete destination data (default true)
        - name: deleteConfig
          in: query
          required: false
          schema:
            type: string
            default: "true"
          description: Delete pipeline configuration (default true). Set to false to delete data only.
      responses:
        '200':
          description: Pipeline deleted
        '500':
          description: Error

  /api/v1/pipelines:
    get:
      tags: [Pipelines]
      summary: List all pipeline configurations
      responses:
        '200':
          description: Array of pipeline configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '500':
          description: Error

  /api/v1/pipeline/dest-types:
    get:
      tags: [Pipelines]
      summary: Propose destination column types from landed data
      description: >-
        Agent-created pipelines store every destination column as text. This
        stateless call samples up to 1000 rows that already landed in the
        destination (postgres, snowflake, or databricks), infers real column
        types deterministically, and returns them with per-column evidence:
        a few distinct sample values, and — for columns kept as string by a
        dirty value — the offending value and the type it blocked. Nothing is
        stored or changed.
      parameters:
        - name: pipeline
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The proposal, or the reason there is none
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: string
                  eligible:
                    type: boolean
                  reason:
                    type: string
                    enum: [destination-not-supported, already-typed, no-landed-rows]
                    description: Present when eligible is false.
                  message:
                    type: string
                  sampleRowCount:
                    type: integer
                  fields:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        type:
                          type: string
                          enum: [string, boolean, int, bigint, double, date, timestamp]
                        samples:
                          type: array
                          description: Up to 5 distinct landed values, truncated.
                          items:
                            type: string
                        stringReason:
                          type: object
                          description: Why the column stayed string, when a dirty value blocked a type.
                          properties:
                            value:
                              type: string
                            blocked:
                              type: string
        '400':
          description: Pipeline not found
        '500':
          description: Error
    post:
      tags: [Pipelines]
      summary: Apply destination column types
      description: >-
        Applies column types to an all-string destination. Destination-first:
        if data has already landed the table is migrated before the config
        changes — postgres retypes in place, snowflake/databricks validate
        every landed value with TRY_CAST and then swap the table. Any landed
        value that will not cast fails the whole apply with the column named
        and nothing changed. On success the pipeline definition is updated as
        a new version. The migration locks or replaces the table — do not
        apply while a run is in flight.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline, fields]
              properties:
                pipeline:
                  type: string
                fields:
                  type: array
                  description: Every destination column with its intended type (keep a column as-is with type string).
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [string, boolean, int, bigint, float, double, date, timestamp]
      responses:
        '200':
          description: What was applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: string
                  migrated:
                    type: boolean
                    description: True when a landed table was retyped (vs. config-only).
                  version:
                    type: integer
                  fields:
                    type: array
                    items:
                      type: object
        '400':
          description: Unsupported destination, already typed, invalid fields, or a landed value would not cast
        '500':
          description: Error

  # ── File Upload & AI ────────────────────────────────────────

  /api/v1/pipeline/upload:
    post:
      tags: [Ingestion]
      summary: Upload a file for processing
      description: Upload a data file to a registered pipeline. Returns a pipeline token for tracking job status.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, pipeline]
              properties:
                file:
                  type: string
                  format: binary
                  description: Data file to upload
                pipeline:
                  type: string
                  description: Name of the registered pipeline
                publishertoken:
                  type: string
                  description: Optional publisher identifier
      responses:
        '200':
          description: Pipeline token (for uncompressed files) or empty (for compressed files)
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: Error

  /api/v1/pipeline/generate:
    post:
      tags: [AI]
      summary: AI schema generation
      description: Upload a file and receive an AI-generated pipeline configuration with inferred field names and types.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Sample data file (CSV, JSON, or XML)
                pipeline:
                  type: string
                  description: Pipeline name for the generated configuration
                delimiter:
                  type: string
                  description: CSV delimiter (default comma)
                header:
                  type: boolean
                  description: Whether CSV has a header row (default true)
                allStrings:
                  type: string
                  default: "false"
                  description: If "true", generate every CSV field as a string instead of inferring types
      responses:
        '200':
          description: AI-generated pipeline configuration
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

  /api/v1/pipeline/profile:
    post:
      tags: [AI]
      summary: AI data profiling
      description: Upload a file and receive AI-generated summary statistics, quality issues, and suggested validation rules.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Data file to profile
                delimiter:
                  type: string
                  description: CSV delimiter (default comma)
                header:
                  type: boolean
                  description: Whether CSV has a header row (default true)
                sampleSize:
                  type: integer
                  description: Number of rows to sample (default 200)
      responses:
        '200':
          description: AI-generated data profile
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Error

  # ── Status ──────────────────────────────────────────────────

  /api/v1/pipeline/status:
    get:
      tags: [Status]
      summary: Get job status
      description: Query job status by pipeline token or pipeline name. Returns detailed status when queried by token, or paginated summary when queried by pipeline name.
      parameters:
        - name: publishertoken
          in: query
          schema:
            type: string
          description: Publisher token — returns status rows for every ingestion job sharing this token. Use this to watch a tap run (structured = 1 job, document = N jobs, all covered by one call). Wins over pipelinetoken if both supplied.
        - name: pipelinetoken
          in: query
          schema:
            type: string
          description: Pipeline token from upload
        - name: pipelinename
          in: query
          schema:
            type: string
          description: Pipeline name for summary view
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Page number for paginated results (pipelinename queries only)
        - name: withrollup
          in: query
          schema:
            type: string
            default: "false"
          description: >-
            When "true" on a publishertoken or pipelinetoken query, wraps the
            response in `{rollup, events}`. `rollup.allDone` flips to true when
            every job reaches a terminal state; `rollup.status` is the aggregate
            outcome (success, warning, error, or processing); `rollup.jobs[]`
            carries per-job status (success, warning, error, processing, or
            timed_out) plus `lastError` on failures; `events` is the same raw
            entry array returned without the flag. Recommended for agents that
            need a single boolean to poll on. Ignored for pipelinename summary
            queries, which return their own rollup-equivalent shape.
      responses:
        '200':
          description: >-
            Job status information. An array of status entries by default; an
            object (`{rollup, events}` for token queries with withrollup=true,
            or the paginated summary shape for pipelinename queries) otherwise.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      type: object
                  - type: object
        '500':
          description: Error

    delete:
      tags: [Status]
      summary: Clear all ingestion history
      description: Deletes every job status entry — detail rows and per-pipeline summaries — for the environment.
      responses:
        '200':
          description: Number of entries deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
        '500':
          description: Error

  # ── Query ───────────────────────────────────────────────────

  /api/v1/query/postgres:
    post:
      tags: [Query]
      summary: Query PostgreSQL
      description: Execute a read-only SQL SELECT query against PostgreSQL. Enforces SELECT-only, blocks dangerous keywords, and auto-appends LIMIT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql]
              properties:
                sql:
                  type: string
                  description: SQL SELECT query to execute
                  example: "SELECT * FROM test.stock_price WHERE volume > 1000000"
                database:
                  type: string
                  default: datris
                  description: PostgreSQL database name
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return. Use -1 for unlimited (no row cap).
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error

  /api/v1/query/mongodb:
    post:
      tags: [Query]
      summary: Query MongoDB
      description: Query a MongoDB collection with optional filter and projection. Blocks $where and $function operators.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection:
                  type: string
                  description: MongoDB collection name
                filter:
                  type: object
                  default: {}
                  description: MongoDB query filter
                projection:
                  type: object
                  description: Fields to include/exclude
                limit:
                  type: integer
                  default: 20
                  description: Maximum documents to return. Use -1 for unlimited (no row cap).
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Error

  /api/v1/query/objectstore:
    post:
      tags: [Query]
      summary: Query object store
      description: Read rows back from the files an object-store-destination pipeline has written (Parquet, ORC, CSV, or JSON), without downloading them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: string
                  description: Name of a pipeline with an objectStore destination
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return
      responses:
        '200':
          description: Query results with file metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: string
                  path:
                    type: string
                    description: Object path the rows were read from
                  format:
                    type: string
                    description: File format (e.g. parquet, orc, csv, json)
                  columns:
                    type: array
                    items:
                      type: string
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '400':
          description: User-actionable error (e.g. unknown pipeline, no objectStore destination)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error

  /api/v1/query/snowflake:
    post:
      tags: [Query]
      summary: Query Snowflake
      description: Execute a read-only SQL query against the Snowflake destination of a pipeline. Connection credentials come from the pipeline's configured `credentialsSecret`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: string
                  description: Name of a pipeline with a Snowflake destination
                sql:
                  type: string
                  description: SQL query to execute. Omit to select everything from the pipeline's destination table.
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return
      responses:
        '200':
          description: Query results including the SQL that was executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: string
                  sql:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '400':
          description: User-actionable error (e.g. unknown pipeline, no Snowflake destination)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error

  /api/v1/query/databricks:
    post:
      tags: [Query]
      summary: Query Databricks
      description: Execute a read-only SQL query against the Databricks destination of a pipeline (a Unity Catalog managed Delta table). Connection credentials come from the pipeline's configured `credentialsSecret`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipeline]
              properties:
                pipeline:
                  type: string
                  description: Name of a pipeline with a Databricks destination
                sql:
                  type: string
                  description: SQL query to execute. Omit to select everything from the pipeline's destination table.
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return
      responses:
        '200':
          description: Query results including the SQL that was executed
          content:
            application/json:
              schema:
                type: object
                properties:
                  pipeline:
                    type: string
                  sql:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '400':
          description: User-actionable error (e.g. unknown pipeline, no Databricks destination)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Error

  /api/v1/query/natural:
    post:
      tags: [Query]
      summary: Natural-language query (AI)
      description: Ask a question in plain English against a PostgreSQL table. The server reads the table's columns, uses AI to generate a SQL SELECT, executes it, and returns both the SQL and the results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, table]
              properties:
                question:
                  type: string
                  description: Plain-English question to answer
                table:
                  type: string
                  description: PostgreSQL table to query
                database:
                  type: string
                  default: datris
                  description: PostgreSQL database name
                schema:
                  type: string
                  default: public
                  description: PostgreSQL schema
                limit:
                  type: integer
                  default: 100
                  description: Maximum rows to return
      responses:
        '200':
          description: Generated SQL and query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  question:
                    type: string
                  sql:
                    type: string
                  results:
                    type: array
                    items:
                      type: object
                  count:
                    type: integer
        '500':
          description: Error (including table not found)

  /api/v1/job/kill:
    post:
      tags: [Status]
      summary: Kill a running job
      description: Interrupt and cancel a running pipeline job by its pipeline token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pipelineToken]
              properties:
                pipelineToken:
                  type: string
                  description: Pipeline token of the running job
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KillJobResponse'
        '500':
          description: Error (job not found, not running, or thread not alive)

  # ── Vector Search ───────────────────────────────────────────

  /api/v1/search/{store}:
    post:
      tags: [Search]
      summary: Semantic search (all vector stores)
      description: >-
        Search a vector store using natural language. One endpoint serves every
        supported store — the `{store}` path segment selects it. Generates an
        embedding from the query and returns the most similar document chunks.
        Connection and embedding secrets are always resolved server-side from
        the server's configuration; any client-supplied secret names are
        ignored. Request fields vary slightly per store — qdrant, milvus, and
        chroma name their container with `collection`, weaviate with
        `className`, pgvector with `table` (plus an optional `schema`).
      parameters:
        - name: store
          in: path
          required: true
          schema:
            type: string
            enum: [qdrant, weaviate, milvus, chroma, pgvector]
          description: Vector store to search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: Natural language search query
                collection:
                  type: string
                  default: documents
                  description: Collection name (qdrant, milvus, and chroma only)
                className:
                  type: string
                  default: Documents
                  description: Weaviate class name, PascalCase (weaviate only)
                table:
                  type: string
                  default: documents
                  description: PostgreSQL table name (pgvector only)
                schema:
                  type: string
                  default: public
                  description: PostgreSQL schema (pgvector only)
                topK:
                  type: integer
                  default: 5
                  description: Number of results to return
      responses:
        '200':
          description: Search results with similarity scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: >-
            User-actionable error, returned as a plain message. Sent for an
            unknown or unavailable `{store}` (the message names the valid
            stores, e.g. "Unknown vector store: 'faiss'. Valid stores: chroma,
            milvus, pgvector, qdrant, weaviate"), a missing `query`, or an
            embedding dimension mismatch between ingest and query.
        '500':
          description: Error

  # ── Version ─────────────────────────────────────────────────

  /api/v1/version:
    get:
      tags: [Status]
      summary: Get server version
      responses:
        '200':
          description: Server version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '500':
          description: Error

  # ── Metadata Discovery ────────────────────────────────────

  /api/v1/metadata/postgres/databases:
    get:
      tags: [Metadata]
      summary: List PostgreSQL databases
      description: List all PostgreSQL databases available in the platform.
      responses:
        '200':
          description: Array of database names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/schemas:
    get:
      tags: [Metadata]
      summary: List PostgreSQL schemas
      description: List all schemas in a PostgreSQL database.
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
      responses:
        '200':
          description: Array of schema names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/tables:
    get:
      tags: [Metadata]
      summary: List PostgreSQL tables
      description: List all tables in a PostgreSQL schema. Set vectorOnly to true to filter to tables with an embedding column (pgvector tables).
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
        - name: schema
          in: query
          schema:
            type: string
            default: public
          description: Schema name
        - name: vectorOnly
          in: query
          schema:
            type: string
            default: "false"
          description: If "true", only return tables with an embedding column
      responses:
        '200':
          description: Array of table names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/postgres/columns:
    get:
      tags: [Metadata]
      summary: List table columns
      description: List all columns and their data types for a specific PostgreSQL table.
      parameters:
        - name: database
          in: query
          schema:
            type: string
            default: datris
          description: Database name
        - name: schema
          in: query
          schema:
            type: string
            default: public
          description: Schema name
        - name: table
          in: query
          required: true
          schema:
            type: string
          description: Table name
      responses:
        '200':
          description: Array of column definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ColumnInfo'
        '500':
          description: Error

  /api/v1/metadata/mongodb/databases:
    get:
      tags: [Metadata]
      summary: List MongoDB databases
      description: List all MongoDB databases available in the platform. Excludes system databases (admin, config, local).
      responses:
        '200':
          description: Array of database names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/mongodb/collections:
    get:
      tags: [Metadata]
      summary: List MongoDB collections
      description: List MongoDB collections. If database is specified, lists collections in that database. Otherwise lists all collections across all databases in "db.collection" format.
      parameters:
        - name: database
          in: query
          schema:
            type: string
          description: Database name (optional; omit to list from all databases)
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  # ── Vector Store Metadata ──────────────────────────────────

  /api/v1/metadata/qdrant/collections:
    get:
      tags: [Metadata]
      summary: List Qdrant collections
      description: List all collections in the Qdrant vector database. Returns an empty array if Qdrant is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/weaviate/classes:
    get:
      tags: [Metadata]
      summary: List Weaviate classes
      description: List all classes in the Weaviate vector database. Returns an empty array if Weaviate is not configured.
      responses:
        '200':
          description: Array of class names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/milvus/collections:
    get:
      tags: [Metadata]
      summary: List Milvus collections
      description: List all collections in the Milvus vector database. Returns an empty array if Milvus is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  /api/v1/metadata/chroma/collections:
    get:
      tags: [Metadata]
      summary: List Chroma collections
      description: List all collections in the Chroma vector database. Returns an empty array if Chroma is not configured.
      responses:
        '200':
          description: Array of collection names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '500':
          description: Error

  # ── AI Answer ──────────────────────────────────────────────

  /api/v1/ai/answer:
    post:
      tags: [AI]
      summary: AI-powered question answering
      description: Use AI to answer a question based on provided context. Ideal for RAG workflows — retrieve relevant chunks via vector search, then pass them as context along with the user's question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiAnswerRequest'
      responses:
        '200':
          description: AI-generated answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAnswerResponse'
        '500':
          description: Error

  # ── Configuration ──────────────────────────────────────────

  /api/v1/config/upload:
    post:
      tags: [Configuration]
      summary: Upload a configuration file
      description: Upload a JSON Schema for pipeline dataQuality schema validation to storage. The uploaded file can then be referenced by pipeline configurations.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, file]
              properties:
                type:
                  type: string
                  enum: [validation-schema]
                  description: "Config file type: 'validation-schema' for JSON Schema"
                file:
                  type: string
                  format: binary
                  description: Configuration file to upload
      responses:
        '200':
          description: Upload confirmation with storage path
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUploadResponse'
        '500':
          description: Error

  # ── Health Check ───────────────────────────────────────────

  /api/v1/health/services:
    get:
      tags: [Health]
      summary: Check backend service health
      description: Returns the health status of all configured backend services including PostgreSQL, MongoDB, MinIO, ActiveMQ, Kafka, and vector databases (Qdrant, Weaviate, Milvus, Chroma, pgvector). Each service reports "up", "down", or "not_configured".
      responses:
        '200':
          description: Service health status map
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    status:
                      type: string
                      enum: [up, down, not_configured]
                    message:
                      type: string
              example:
                postgres:
                  status: up
                  message: Connected
                mongodb:
                  status: up
                  message: Connected
                qdrant:
                  status: not_configured
        '500':
          description: Error

  # ── Secrets ──────────────────────────────────────────────

  /api/v1/secrets:
    get:
      tags: [Secrets]
      summary: List all secrets
      description: Lists all secret names under the current environment path in Vault.
      responses:
        '200':
          description: Array of secret names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              example: ["postgres", "mongodb", "embedding", "qdrant"]
        '500':
          description: Error

  /api/v1/secrets/{name}:
    get:
      tags: [Secrets]
      summary: Get secret details
      description: Returns the key-value fields of a secret. Sensitive fields (password, apiKey, secretKey, token) are masked unless reveal=true.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: reveal
          in: query
          schema:
            type: string
            default: "false"
      responses:
        '200':
          description: Secret details with fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  fields:
                    type: object
                    additionalProperties:
                      type: string
        '404':
          description: Secret not found
        '500':
          description: Error
    put:
      tags: [Secrets]
      summary: Create or update a secret
      description: Creates or updates a secret with the provided key-value fields.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Success
        '500':
          description: Error
    delete:
      tags: [Secrets]
      summary: Delete a secret
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
        '500':
          description: Error

  # ── Schema Generation ────────────────────────────────────

  /api/v1/config/generate-schema:
    post:
      tags: [Configuration]
      summary: AI-generate a validation schema
      description: Uses AI to generate a JSON Schema (Draft 4) or W3C XSD from sample data. The schema is stored in MinIO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name, sampleData]
              properties:
                type:
                  type: string
                  enum: [json-schema, xsd]
                name:
                  type: string
                sampleData:
                  type: string
      responses:
        '200':
          description: Generated schema with filename and content
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  path:
                    type: string
                  schema:
                    type: string
        '500':
          description: Error

  # ── Taps (Beta) ──────────────────────────────────────────

  /api/v1/taps:
    get:
      tags: [Taps]
      summary: List all taps
      description: Returns all registered tap configurations.
      responses:
        '200':
          description: Array of tap configurations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TapConfig'

  /api/v1/tap:
    get:
      tags: [Taps]
      summary: Get a tap configuration
      description: Returns a single tap configuration, including the script content from MinIO.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Tap name
      responses:
        '200':
          description: Tap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapDetail'
        '404':
          description: Tap not found
    post:
      tags: [Taps]
      summary: Create or update a tap
      description: Creates a new tap or updates an existing tap with the same `name`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapConfig'
      responses:
        '200':
          description: Saved tap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapConfig'
        '400':
          description: Validation error
    delete:
      tags: [Taps]
      summary: Delete a tap
      description: Deletes the tap configuration and its script from MinIO.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Tap not found

  /api/v1/tap/logs:
    get:
      tags: [Taps]
      summary: Get tap run history
      description: Returns the last 50 run log entries for a tap, sorted by most recent first.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of run log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TapRunLog'

  /api/v1/tap/logs/all:
    get:
      tags: [Taps]
      summary: Get run history across all taps
      description: Returns run log entries for every tap, newest window first. Feeds the Ops activity dashboard's aggregation. Defaults to the last 30 days, capped at 2000 rows.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
            format: int64
          description: Only return runs created at or after this epoch-milliseconds timestamp (default now minus 30 days)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 2000
            maximum: 5000
          description: Maximum entries to return (values above 5000 are clamped)
      responses:
        '200':
          description: Array of run log entries across all taps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TapRunLog'
        '500':
          description: Error

  /api/v1/tap/brainstorm:
    post:
      tags: [Taps]
      summary: Brainstorm chat (AI)
      description: |
        Multi-turn conversational endpoint that helps refine a vague tap idea into a clear instruction.
        The AI asks one focused clarifying question at a time, suggests data sources, recognizes Datris
        platform tables, and returns an updated instruction draft on every turn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapBrainstormRequest'
      responses:
        '200':
          description: Updated chat reply, instruction draft, and suggested env vars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapBrainstormResponse'

  /api/v1/tap/generate:
    post:
      tags: [Taps]
      summary: Generate tap script (AI)
      description: >-
        Uses AI to generate a Python `fetch()` script from a plain-English
        description. The system prompt branches on `tapType` — document taps
        get a prompt that instructs the LLM to return `{uri, filename, content}`
        dicts, never chunk or embed, and never fall back to scanning the local
        filesystem.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, tapName]
              properties:
                description:
                  type: string
                tapName:
                  type: string
                oldScriptPath:
                  type: string
                  description: Path of a previous script to delete after the new one is written
                secretName:
                  type: string
                  description: Tap secret name — env var keys are passed to the AI as context
                tapType:
                  type: string
                  enum: [structured, document]
                  default: structured
                  description: Selects the system prompt for the generated script.
      responses:
        '200':
          description: Generated script
          content:
            application/json:
              schema:
                type: object
                properties:
                  script:
                    type: string
                  packages:
                    type: array
                    items:
                      type: string
                  scriptPath:
                    type: string

  /api/v1/tap/generate/status:
    get:
      tags: [Taps]
      summary: Live progress of an in-flight script generation
      description: >-
        Reports what a blocking `/tap/generate` call is currently doing so
        clients can show real progress during the 1–3 minute wait. Poll every
        few seconds while a generate request is in flight. `active: false`
        means no generation is running for this tap.
      parameters:
        - name: tap
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Progress snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  phase:
                    type: string
                    enum: [calling-model, retrying-format, storing]
                  attempt:
                    type: integer
                  elapsedSeconds:
                    type: integer
                  phaseElapsedSeconds:
                    type: integer
        '500':
          description: Error

  /api/v1/tap/fix:
    post:
      tags: [Taps]
      summary: Fix tap script (AI diagnosis)
      description: Uses AI to fix a script based on a diagnosis of what went wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tapName, script]
              properties:
                tapName:
                  type: string
                script:
                  type: string
                diagnosis:
                  type: string
                logs:
                  type: string
                error:
                  type: string
                oldScriptPath:
                  type: string
      responses:
        '200':
          description: Fixed script (same shape as /tap/generate)

  /api/v1/tap/script:
    post:
      tags: [Taps]
      summary: Store a tap script
      description: >-
        Stores a (typically hand-edited) Python script in the resolved storage
        backend and, if the tap already exists, updates its script reference.
        Backend resolution: explicit `storage` in the body, else the existing
        tap's backend, else the tenant default (the code repository when one is
        enabled, built-in storage otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tapName, script]
              properties:
                tapName:
                  type: string
                script:
                  type: string
                  description: Python script body to store
                oldScriptPath:
                  type: string
                  description: Path of a previous script to delete after the new one is written
                storage:
                  type: string
                  enum: [minio, github]
                  description: Explicit storage backend override
                baseCommitSha:
                  type: string
                  description: >-
                    Repo storage only — the commit the editor loaded the script
                    at. If the file changed in the repository since, the write
                    is rejected with 409 instead of overwriting.
      responses:
        '200':
          description: Reference of the saved script (fields depend on the backend)
          content:
            application/json:
              schema:
                type: object
                properties:
                  scriptPath:
                    type: string
                    nullable: true
                  storage:
                    type: string
                    enum: [minio, github]
                  scriptRepoPath:
                    type: string
                    nullable: true
                  scriptCommitSha:
                    type: string
                    nullable: true
        '409':
          description: The script changed in the repository since `baseCommitSha` — pull the latest, reapply edits, and retry
        '500':
          description: Error (including missing tapName or script)

  /api/v1/tap/script/pull:
    post:
      tags: [Taps]
      summary: Pull a repo-backed tap script from its branch head
      description: >-
        Re-reads a repository-stored tap script at the configured branch head
        and reports drift against the tap's pinned commit. With `apply=true`,
        also advances the pin (a versioned edit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tapName]
              properties:
                tapName:
                  type: string
                apply:
                  type: string
                  enum: ['true', 'false']
                  description: Advance the tap's pinned commit to the branch head when drifted
      responses:
        '200':
          description: Drift status
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  drifted:
                    type: boolean
                  headCommitSha:
                    type: string
                  pinnedCommitSha:
                    type: string
                  script:
                    type: string
                    description: Present only when drifted — the branch-head source
                  applied:
                    type: boolean
        '500':
          description: Error (tap not found, or tap is not repository-backed)

  /api/v1/tap/migrate-storage:
    post:
      tags: [Taps]
      summary: Move a tap script between storage backends
      description: >-
        Reads the script from its current backend, writes it to the target
        (built-in object storage or the code repository), and stamps the tap
        as a versioned edit. Idempotent when the tap is already on the target.
        Built-in objects are never deleted on migrate-out — version snapshots
        pin them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tapName, target]
              properties:
                tapName:
                  type: string
                target:
                  type: string
                  enum: [github, minio]
      responses:
        '200':
          description: The migrated tap config
        '400':
          description: Unknown tap, unreadable script, or invalid target
        '500':
          description: Error

  /api/v1/code-repo:
    get:
      tags: [Code repository]
      summary: Get the tenant code repository configuration
      description: Returns the code repository connection used for tap script storage. The auth token itself lives in Vault and is never returned.
      responses:
        '200':
          description: Current configuration (defaults when none saved yet)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeRepoConfig'
        '500':
          description: Error
    put:
      tags: [Code repository]
      summary: Save the tenant code repository configuration
      description: >-
        Validates the connection when `enabled` (token can push, branch
        exists — verified via the repository `permissions` block, no probe
        commits) and persists the configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRepoConfig'
      responses:
        '200':
          description: The saved configuration
        '400':
          description: Validation failed (bad repo, token lacks push access, missing branch, or missing token secret)
        '500':
          description: Error

  /api/v1/code-repo/test:
    post:
      tags: [Code repository]
      summary: Test a code repository connection
      description: Round-trip check for the posted configuration — repository reachable, token has push access, branch exists. Always returns 200 with an `ok` flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeRepoConfig'
      responses:
        '200':
          description: Test outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  canPush:
                    type: boolean
                  branchExists:
                    type: boolean
                  defaultBranch:
                    type: string
                  branches:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    description: Present when `ok` is false

  /api/v1/tap/review:
    post:
      tags: [Taps]
      summary: Review tap script (AI)
      description: >-
        Uses AI to review a script after a successful test run — correctness,
        robustness, and adherence to tap conventions. May return the script
        rewritten. When it rewrites and the tap already exists, the tap's
        `scriptPath` is updated to the new object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                tapName:
                  type: string
                script:
                  type: string
                recordCount:
                  type: integer
                  description: Record count from the latest test run
                durationMs:
                  type: integer
                  format: int64
                  description: Duration of the latest test run in milliseconds
                logs:
                  type: string
                  description: Logs from the latest test run
                oldScriptPath:
                  type: string
                  description: Path of the current script, deleted if a rewrite is stored
                priorIterations:
                  type: string
                  description: JSON-encoded array of prior review/optimize iterations, so the AI doesn't repeat suggestions
      responses:
        '200':
          description: Review result
          content:
            application/json:
              schema:
                type: object
                properties:
                  script:
                    type: string
                  packages:
                    type: array
                    items:
                      type: string
                  scriptPath:
                    type: string
                  changes:
                    type: array
                    items:
                      type: string
                    description: Human-readable list of what changed
                  rewritten:
                    type: boolean
                    description: True when the AI produced a modified script
        '500':
          description: Error (including missing script)

  /api/v1/tap/optimize:
    post:
      tags: [Taps]
      summary: Optimize tap script (AI)
      description: >-
        Uses AI to optimize a working script for speed and efficiency (based on
        the latest run's record count and duration). Always stores the returned
        script; if the tap already exists, its `scriptPath` is updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                tapName:
                  type: string
                script:
                  type: string
                recordCount:
                  type: integer
                durationMs:
                  type: integer
                  format: int64
                logs:
                  type: string
                oldScriptPath:
                  type: string
                priorIterations:
                  type: string
                  description: JSON-encoded array of prior review/optimize iterations
      responses:
        '200':
          description: Optimized script
          content:
            application/json:
              schema:
                type: object
                properties:
                  script:
                    type: string
                  packages:
                    type: array
                    items:
                      type: string
                  scriptPath:
                    type: string
                  changes:
                    type: array
                    items:
                      type: string
        '500':
          description: Error (including missing script)

  /api/v1/tap/test:
    post:
      tags: [Taps]
      summary: Test a tap
      description: |
        Executes the tap script without sending data to a pipeline. Returns results, logs, and an
        AI-generated diagnosis if errors or zero records are detected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapConfig'
      responses:
        '200':
          description: Test results
          content:
            application/json:
              schema:
                type: object
                properties:
                  records:
                    type: array
                    items:
                      type: object
                  recordCount:
                    type: integer
                  dataType:
                    type: string
                  columns:
                    type: array
                    items:
                      type: string
                  logs:
                    type: string
                  error:
                    type: string
                  aiExplanation:
                    type: string

  /api/v1/tap/run:
    post:
      tags: [Taps]
      summary: Run a tap
      description: Executes a saved tap. Optionally sends data to the configured pipeline.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum: [run, test]
                  default: test
                  description: "'run' feeds records into the configured target pipeline; 'test' executes the script and returns results without persisting"
                params:
                  type: object
                  additionalProperties: true
                  description: >-
                    Optional per-run parameters. Each value is stringified and
                    exposed to the tap script as an environment variable (nested
                    objects/arrays are JSON-encoded so the script can json.loads()
                    them back). Use for date-windowed backfills, e.g.
                    {"since": "2026-05-01", "until": "2026-05-02"}. From Airflow,
                    pass Jinja-templated values like {"since": "{{ ds }}"}.
                  example:
                    since: "2026-05-01"
                    until: "2026-05-02"
      responses:
        '200':
          description: Run result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapRunResult'

  /api/v1/tap/cron:
    post:
      tags: [Taps]
      summary: Generate CRON expression (AI)
      description: Converts a plain-English schedule description to a Quartz CRON expression.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description]
              properties:
                description:
                  type: string
                  example: Every weekday at 4pm ET
      responses:
        '200':
          description: Generated CRON expression
          content:
            application/json:
              schema:
                type: object
                properties:
                  cronExpression:
                    type: string
                    example: 0 0 16 ? * MON-FRI

  /api/v1/tap/ledger:
    get:
      tags: [Taps]
      summary: Read a document tap's ledger
      description: >-
        Returns every ledger entry owned by the tap. The ledger records which
        documents the tap has already staged so re-runs skip unchanged files.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TapDocumentLedgerEntry'
    delete:
      tags: [Taps]
      summary: Clear the ledger (force re-scan) or delete one entry (force re-process)
      description: >-
        With only `name`, clears the entire ledger for the tap and deletes every
        staged MinIO object — the next run re-ingests every document from source.
        With `name` and `uri`, deletes one entry and its staged object so that
        specific document is re-processed on the next run.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
        - name: uri
          in: query
          required: false
          schema: { type: string }
          description: Single-entry URI. Omit to clear the whole ledger.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/tap/state:
    get:
      tags: [Taps]
      summary: Read a tap's incremental-sync state
      description: >-
        Returns the bookmark/cursor the tap's script saved after its last
        successful run — the object the next run receives via the
        DATRIS_TAP_STATE environment variable. `state` is null when the tap has
        never committed state (non-incremental tap, or no successful run yet).
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                type: object
                properties:
                  tap: { type: string }
                  state:
                    type: object
                    nullable: true
                    additionalProperties: true
                  updatedAt: { type: string }
                  updatedBy:
                    type: string
                    description: The committing run's key (`tapName|runTime`), or `manual` for API/UI overrides.
        '500':
          description: Error
    post:
      tags: [Taps]
      summary: Overwrite a tap's incremental-sync state
      description: >-
        Sets the state object the next run receives via DATRIS_TAP_STATE — e.g.
        rewind a cursor so a window is re-fetched. The state shape is defined by
        the tap's own script. Committed state is capped at 64 KB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, state]
              properties:
                name: { type: string }
                state:
                  type: object
                  additionalProperties: true
      responses:
        '200':
          description: State saved
        '500':
          description: Error (unknown tap, or state is not a JSON object)
    delete:
      tags: [Taps]
      summary: Reset a tap's incremental-sync state
      description: >-
        Deletes the stored state entirely. The next run sees no
        DATRIS_TAP_STATE and performs a full first-run fetch.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: State reset
        '500':
          description: Error

  /api/v1/vector-stores/available:
    get:
      tags: [Health]
      summary: List live, reachable vector stores
      description: >-
        Returns the subset of `[qdrant, weaviate, pgvector, milvus, chroma]`
        whose Vault secret is present AND whose service responds to a probe.
        Drives the document-tap pipeline wizard's store picker. Secret presence
        alone isn't sufficient — the dev stack seeds placeholder secrets for
        every store, so this endpoint must actually probe each one (2s timeout
        per store, ~10s worst case if everything is unreachable).
      responses:
        '200':
          description: Available vector stores
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [pgvector]
        '500':
          description: Error

  /api/v1/destinations/available:
    get:
      tags: [Health]
      summary: List usable structured destinations
      description: >-
        Returns the subset of `[mongodb, postgres, objectstore, snowflake,
        databricks]` usable in this deployment. Drives the pipeline wizard's and
        Assistant's destination picker. Two availability semantics on purpose:
        the self-hosted destinations (mongodb, postgres, objectstore) are
        live-probed — secret presence alone isn't a reliable signal because the
        compose stack seeds their secrets even when a service is disabled; the
        external SaaS destinations (snowflake, databricks) have no local service
        to probe, so they are included when any Platform secret carries a
        complete credential set for them.
      responses:
        '200':
          description: Available destinations
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
                example: [mongodb, postgres, objectstore]
        '500':
          description: Error

  # ── Version History ────────────────────────────────────────

  /api/v1/tap/versions:
    get:
      tags: [Versions]
      summary: List tap definition versions
      description: Lists the saved definition versions of a tap, newest first. Every versioned save (create, update, restore) appends a snapshot.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Tap name
      responses:
        '200':
          description: Version summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityVersionSummary'
        '500':
          description: Error

  /api/v1/tap/version:
    get:
      tags: [Versions]
      summary: Get a tap version snapshot
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full snapshot including the pinned script content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityVersionSnapshot'
        '404':
          description: No such version for this tap
        '500':
          description: Error

  /api/v1/tap/version/diff:
    get:
      tags: [Versions]
      summary: Diff two tap versions
      description: Server-computed, ready-to-render diff of the tap configuration and script between two versions.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
          description: Target version of the comparison
        - name: against
          in: query
          required: true
          schema:
            type: integer
          description: Base version to compare against
      responses:
        '200':
          description: Field-level config diff and line-level script diff
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityVersionDiff'
        '404':
          description: One of the versions does not exist
        '500':
          description: Error

  /api/v1/tap/version/restore:
    post:
      tags: [Versions]
      summary: Restore a tap version
      description: >-
        Restores the tap's DEFINITION from the given version snapshot,
        preserving the live tap's creation metadata, ownership, and run-status
        fields. The restore itself is saved as a new version.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The restored tap configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapConfig'
        '404':
          description: No such version for this tap
        '500':
          description: Error

  /api/v1/pipeline/versions:
    get:
      tags: [Versions]
      summary: List pipeline definition versions
      description: Lists the saved definition versions of a pipeline, newest first.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
          description: Pipeline name
      responses:
        '200':
          description: Version summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntityVersionSummary'
        '500':
          description: Error

  /api/v1/pipeline/version:
    get:
      tags: [Versions]
      summary: Get a pipeline version snapshot
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Full snapshot (no script fields — pipelines have no script)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityVersionSnapshot'
        '404':
          description: No such version for this pipeline
        '500':
          description: Error

  /api/v1/pipeline/version/diff:
    get:
      tags: [Versions]
      summary: Diff two pipeline versions
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
          description: Target version of the comparison
        - name: against
          in: query
          required: true
          schema:
            type: integer
          description: Base version to compare against
      responses:
        '200':
          description: Field-level config diff (no script section)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityVersionDiff'
        '404':
          description: One of the versions does not exist
        '500':
          description: Error

  /api/v1/pipeline/version/restore:
    post:
      tags: [Versions]
      summary: Restore a pipeline version
      description: Restores the pipeline's definition from the given version snapshot, preserving ownership. The restore itself is saved as a new version.
      parameters:
        - name: name
          in: query
          required: true
          schema:
            type: string
        - name: version
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: The restored pipeline configuration
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No such version for this pipeline
        '500':
          description: Error

  # ── Authentication & Users ─────────────────────────────────

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: >-
        Authenticates a user and sets an HTTP-only session cookie. Only
        available when user auth is enabled on the server. For a user whose
        password has not been set yet (`mustSetPassword`), any password is
        accepted and the client must immediately call `/auth/change-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Authenticated; session cookie set
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  role:
                    type: string
                  mustSetPassword:
                    type: boolean
        '400':
          description: Username is required
        '401':
          description: Invalid username or password
        '404':
          description: User auth is not enabled on this server
        '500':
          description: Error

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Deletes the server-side session and clears the session cookie.
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Get the current user
      description: UI bootstrap probe — returns the session's user, or 401 if there is no session.
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  role:
                    type: string
                  mustSetPassword:
                    type: boolean
        '401':
          description: Not authenticated

  /api/v1/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      description: Requires an authenticated session. The current-password check is skipped on a first-time set (`mustSetPassword`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword:
                  type: string
                  description: Required unless this is the user's first-time password set
                newPassword:
                  type: string
                  minLength: 5
      responses:
        '200':
          description: Password updated
        '400':
          description: New password too short
        '401':
          description: Not authenticated, or current password is incorrect
        '500':
          description: Error

  /api/v1/auth/users:
    get:
      tags: [Auth]
      summary: List users (admin)
      description: Admin-only. Timestamps are formatted using the server's configured date format and timezone.
      responses:
        '200':
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    username:
                      type: string
                    role:
                      type: string
                    createdAt:
                      type: string
                    lastLoginAt:
                      type: string
                      nullable: true
                    mustSetPassword:
                      type: boolean
    post:
      tags: [Auth]
      summary: Create a user (admin)
      description: Admin-only. Omit `password` to create the user in first-login mode — they set their own password on first sign-in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username:
                  type: string
                  description: Lowercase; letters, digits, and . _ @ - only
                role:
                  type: string
                  description: One of the valid platform roles (e.g. admin)
                password:
                  type: string
                  description: Optional initial password
      responses:
        '201':
          description: User created
        '400':
          description: Missing/invalid username or invalid role
        '409':
          description: User already exists
        '500':
          description: Error

  /api/v1/auth/users/{username}:
    patch:
      tags: [Auth]
      summary: Update a user (admin)
      description: >-
        Admin-only. Change a user's role and/or reset their password (back to
        first-login mode). The built-in `admin` user is locked to the admin
        role, and the last remaining admin cannot be demoted.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                resetPassword:
                  type: boolean
                  description: If true, clears the password so the user must set a new one on next login
      responses:
        '200':
          description: User updated
        '400':
          description: Invalid role
        '404':
          description: User not found
        '409':
          description: Role change refused (built-in admin locked, or last admin)
        '500':
          description: Error
    delete:
      tags: [Auth]
      summary: Delete a user (admin)
      description: Admin-only. The built-in `admin` recovery account can never be deleted, and the last remaining admin cannot be deleted.
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
        '404':
          description: User not found
        '409':
          description: Deletion refused (built-in admin, or last admin)
        '500':
          description: Error

  # ── API Keys ───────────────────────────────────────────────

  /api/v1/keys:
    get:
      tags: [API Keys]
      summary: List API keys (admin)
      description: >-
        Admin-only. Lists every issued API key with its capabilities and audit
        metadata. Key VALUES are never returned here — only on issue and
        rotate, one time. Keys issued before capability metadata existed are
        flagged `isLegacyFullAccess`.
      responses:
        '200':
          description: All keys, without values
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        capabilities:
                          type: array
                          items:
                            type: string
                        revoked:
                          type: boolean
                        createdAt:
                          type: string
                        createdBy:
                          type: string
                        revokedAt:
                          type: string
                        revokedBy:
                          type: string
                        isLegacyFullAccess:
                          type: boolean
        '500':
          description: Error
    post:
      tags: [API Keys]
      summary: Issue a new API key (admin)
      description: Admin-only. The returned `value` is shown ONCE and cannot be retrieved again — store it immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: 1-64 chars of lowercase letters, digits, dash, underscore
                capabilities:
                  type: array
                  items:
                    type: string
                  description: Capability strings, e.g. "pipeline:read" or "secret:write:_type=tap" (see /keys/capabilities/catalog)
      responses:
        '200':
          description: The new key, including its one-time value
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: string
                    description: The API key secret — shown only in this response
                  capabilities:
                    type: array
                    items:
                      type: string
                  createdAt:
                    type: string
                  createdBy:
                    type: string
        '400':
          description: Missing/invalid label or invalid capability string
        '409':
          description: A key with this label already exists
        '500':
          description: Error

  /api/v1/keys/{label}:
    delete:
      tags: [API Keys]
      summary: Revoke an API key (admin)
      description: Admin-only. Marks the key revoked; it immediately stops authenticating, and subsequent attempts are logged as "revoked key".
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: revoked
                  label:
                    type: string
        '404':
          description: Key not found
        '500':
          description: Error

  /api/v1/keys/{label}/rotate:
    post:
      tags: [API Keys]
      summary: Rotate an API key (admin)
      description: >-
        Admin-only. Generates a new value for the key; the previous value stops
        working immediately. Capabilities are preserved. The returned value is
        shown once — update every caller that held the old value.
      parameters:
        - name: label
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The rotated key, including its one-time value
          content:
            application/json:
              schema:
                type: object
                properties:
                  label:
                    type: string
                  value:
                    type: string
                  rotatedAt:
                    type: string
        '404':
          description: Key not found
        '500':
          description: Error

  /api/v1/keys/capabilities/catalog:
    get:
      tags: [API Keys]
      summary: Capability catalog (admin)
      description: Admin-only. Every capability resource, its actions, and the scope keys it accepts — drives the Keys UI capability editor.
      responses:
        '200':
          description: Capability catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        resource:
                          type: string
                        actions:
                          type: array
                          items:
                            type: string
                        scopeKeys:
                          type: array
                          items:
                            type: string
        '500':
          description: Error

  /api/v1/keys/templates:
    get:
      tags: [API Keys]
      summary: Capability templates (admin)
      description: Admin-only. Common capability-set starting points (read-only, rag-builder, reporting, ops, full-access) offered by the Keys UI wizard.
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        description:
                          type: string
                        capabilities:
                          type: array
                          items:
                            type: string
        '500':
          description: Error

  # ── Assistant ──────────────────────────────────────────────

  /api/v1/assistant/init:
    get:
      tags: [Assistant]
      summary: Initialize the Assistant
      description: UI mount call — warms the MCP client caches and returns the tool catalog, the workflow reference resource, and the active chat model.
      responses:
        '200':
          description: Assistant bootstrap payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  toolCount:
                    type: integer
                  toolNames:
                    type: array
                    items:
                      type: string
                  workflowReference:
                    type: string
                    description: Pipeline-config reference resource text (empty if unavailable)
                  provider:
                    type: string
                    description: Active chat AI provider (lowercase)
                  model:
                    type: string
                  extendedThinking:
                    type: boolean
        '400':
          description: User-actionable error
        '500':
          description: Error

  /api/v1/assistant/chat:
    post:
      tags: [Assistant]
      summary: Assistant chat (SSE)
      description: >-
        Runs the build-mode Assistant agent loop and streams agent-loop events
        (text deltas, tool calls, tool results, errors) as Server-Sent Events.
        The client cancels by disconnecting. Attachments reference files
        previously staged via `/assistant/attachment`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ChatRequest'
                - type: object
                  properties:
                    attachments:
                      type: array
                      items:
                        type: object
                        properties:
                          attachmentId:
                            type: string
                      description: Handles of files staged via /assistant/attachment for this turn
      responses:
        '200':
          description: Server-Sent Events stream of agent-loop events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/assistant/attachment:
    post:
      tags: [Assistant]
      summary: Stage a chat attachment
      description: >-
        Stages a file dropped into the Assistant chat. The bytes are cached
        server-side (tenant-scoped, TTL'd) and only the returned handle plus a
        small content sample travel through the chat; the platform substitutes
        the real bytes when the agent calls a file tool with the
        `attachmentId`. Limit 25 MB per file.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Staged attachment descriptor
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachmentId:
                    type: string
                  filename:
                    type: string
                  detectedType:
                    type: string
                    description: Detected source category (e.g. "CSV (structured)", "document (unstructured)")
                  byteSize:
                    type: integer
                  sample:
                    type: string
                    description: Text sample for the model (capped; binary documents get a one-line note)
        '400':
          description: Empty file
        '413':
          description: File exceeds the 25 MB limit
        '500':
          description: Error

  # ── Chat Panels ────────────────────────────────────────────

  /api/v1/ops-chat/chat:
    post:
      tags: [Chat]
      summary: Ops chat (SSE)
      description: >-
        Agent chat for the Ops dashboard side panel — explains failures and
        acts on runs by name, with operational tools (run, status, kill)
        prioritized. The optional `context` object is a dashboard snapshot
        that grounds answers in the failures and volumes currently on screen.
        Streams the same SSE event format as `/assistant/chat`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-Sent Events stream of agent-loop events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/search-chat/chat:
    post:
      tags: [Chat]
      summary: Search chat (SSE)
      description: >-
        Conversational data discovery for the Search tab — finds the data that
        answers a question, queries/searches it, and answers with citations.
        The tool catalog is filtered server-side to READ-ONLY
        discovery/query/search tools; the agent never sees mutating tools. The
        optional `context` object may carry a catalog scope, e.g.
        `{"catalog": "finance"}` (or "Uncataloged"; "All"/empty means
        unscoped). Streams the same SSE event format as `/assistant/chat`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-Sent Events stream of agent-loop events
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/catalog-chat/chat:
    post:
      tags: [Chat]
      summary: Catalog chat (SSE)
      description: >-
        Agent chat for organizing the inventory — group, move, rename, and
        describe taps and pipelines. Full tool catalog with catalog tools
        prioritized. The optional `context` object is a catalog inventory
        snapshot that grounds answers in what the user is looking at. Streams
        the same SSE event format as `/assistant/chat`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Server-Sent Events stream of agent-loop events
          content:
            text/event-stream:
              schema:
                type: string

  # ── MCP Activity ───────────────────────────────────────────

  /api/v1/mcp/activity:
    get:
      tags: [MCP]
      summary: Get MCP server activity
      description: >-
        Proxies the MCP server's activity feed (agent sessions and tool calls)
        with server-side enrichment: timestamps are formatted with the
        platform's date settings and each session/call is labeled with the
        tenant or key name resolved from its API-key hint. Always returns 200 —
        when the MCP server is unreachable or auth fails, the payload carries
        an `error` message and an `errorKind` of "unreachable" or "auth" with
        empty session/call arrays.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: Only return activity after this server timestamp (from a previous response's server_time; default 0 for everything)
      responses:
        '200':
          description: Activity feed (or an error payload with empty arrays)
          content:
            application/json:
              schema:
                type: object
                properties:
                  server_time:
                    type: number
                  sessions:
                    type: array
                    items:
                      type: object
                  calls:
                    type: array
                    items:
                      type: object
                  error:
                    type: string
                  errorKind:
                    type: string
                    enum: [auth, unreachable]
    delete:
      tags: [MCP]
      summary: Clear MCP activity history
      description: Clears the MCP server's activity buffer so the cleared state survives page reloads. Live sessions are untouched.
      responses:
        '204':
          description: Activity cleared
        '502':
          description: MCP server unreachable or returned an error

  # ── AI Model Catalog ───────────────────────────────────────

  /api/v1/ai/model-catalog:
    get:
      tags: [AI]
      summary: Get the AI model catalog
      description: >-
        Same-origin proxy for the remote model catalog (datris.ai/models.json)
        used by the Configuration UI's model pickers. Successful fetches are
        cached for 5 minutes; on fetch failure the stale cache is served if one
        exists.
      responses:
        '200':
          description: Model catalog JSON
          content:
            application/json:
              schema:
                type: object
        '502':
          description: Catalog unavailable and no cached copy exists

  /api/v1/ai/models:
    get:
      tags: [AI]
      summary: Discover invokable models for a provider
      description: >-
        Live per-provider model discovery, reflecting what the configured
        account can actually invoke (unlike the static catalog). Currently
        supports provider=bedrock: the server calls the AWS Bedrock discovery
        APIs (ListFoundationModels + ListInferenceProfiles) with the configured
        AWS credentials and merges them into invokable ids — a model without
        on-demand support is returned as its cross-region inference-profile id
        (e.g. us.anthropic....). Results are cached for 5 minutes. The
        Configuration UI overlays catalog labels on this list and falls back to
        the static catalog when discovery is unavailable.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
            enum: [bedrock]
      responses:
        '200':
          description: Discovered models
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        value:
                          type: string
                          description: Invokable model or inference-profile id
                        label:
                          type: string
        '400':
          description: Discovery not supported for the given provider
        '502':
          description: >-
            Discovery unavailable — typically no AWS credentials configured, or
            an IAM policy missing bedrock:ListFoundationModels /
            bedrock:ListInferenceProfiles. Callers should fall back to the
            static catalog.

  # ── Tap Prompt Fragments ───────────────────────────────────

  /api/v1/tap-prompts:
    get:
      tags: [Tap Prompts]
      summary: List tap prompt fragments
      description: Returns every prompt fragment. Fragments are per-source snippets injected into the tap code-generation system prompt when a tap's description mentions the fragment's key or an alias.
      responses:
        '200':
          description: All fragments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TapPromptFragment'
        '500':
          description: Error
    post:
      tags: [Tap Prompts]
      summary: Create or update a tap prompt fragment
      description: Creates a new fragment or updates the existing fragment with the same `key`. Timestamps are managed server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TapPromptFragment'
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Error (including missing key)

  /api/v1/tap-prompts/{key}:
    get:
      tags: [Tap Prompts]
      summary: Get a tap prompt fragment
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The fragment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TapPromptFragment'
        '404':
          description: Fragment not found
        '500':
          description: Error
    delete:
      tags: [Tap Prompts]
      summary: Delete a tap prompt fragment
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '500':
          description: Error

  /api/v1/tap-prompts/suggest:
    post:
      tags: [Tap Prompts]
      summary: Suggest fragment content (AI)
      description: Uses AI to draft (or refine) the content of a prompt fragment from its key, aliases, and any existing content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
                  description: Data-source key the fragment is for
                aliases:
                  type: array
                  items:
                    type: string
                content:
                  type: string
                  description: Existing content to refine or expand (optional)
      responses:
        '200':
          description: Suggested fragment content
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: string
        '500':
          description: Error (including missing key)
