# Docker Compose overrides. Spring loads this on top of the JAR-bundled
# application.yaml via --spring.config.additional-location (see docker-init.sh).
# Keep this file as small as possible — only set values that genuinely differ
# from the bundled defaults in localhost mode. Anything else inherits.
#
# To toggle auth / multi-tenancy / api-keys, do NOT add them here — set
# USE_USER_AUTH / USE_API_KEYS / MULTI_TENANT in your .env instead. They
# flow through docker-compose.yml as USEUSERAUTH / USEAPIKEYS / MULTITENANT
# env vars and Spring's relaxed binding overrides the YAML at runtime.

spring:
  data:
    mongodb:
      uri: mongodb://mongodb:27017/datris

minio:
  server: http://minio:9000

activemq:
  server: tcp://activemq:61616

mongodb:
  connectionString: mongodb://mongodb:27017

kafkaConsumer:
  bootstrapServers: kafka:9092
