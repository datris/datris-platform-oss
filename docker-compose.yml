networks:
  datris-net:
    driver: bridge

volumes:
  pip-cache:
  tei-data:
  # kafka-data:        # uncomment if re-enabling the optional Kafka service below
  # zookeeper-data:    # uncomment if re-enabling the optional Kafka service below
  # zookeeper-log:     # uncomment if re-enabling the optional Kafka service below
  # ollama-data:       # uncomment if re-enabling the optional Ollama service below

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  activemq:
    image: apache/activemq-classic:latest
    container_name: activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - datris-net

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    networks:
      - datris-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: datris
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  vault:
    image: hashicorp/vault:1.15
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - datris-net

  vault-init:
    image: hashicorp/vault:1.15
    container_name: vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root-token
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b-instruct}
      AI_PROVIDER: ${AI_PROVIDER:-}
      CODEGEN_MODEL: ${CODEGEN_MODEL:-}
    volumes:
      - ./docker/vault-init.sh:/vault-init.sh
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    restart: "no"
    networks:
      - datris-net

  tei:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    platform: linux/amd64   # TEI publishes amd64 only; arm64 hosts run under Docker's QEMU translation
    container_name: tei
    ports:
      - "11434:80"   # external port preserved so any prior EMBEDDING_ENDPOINT overrides keep working
    command: --model-id BAAI/bge-m3 --max-batch-tokens 8192
    environment:
      HUGGINGFACE_HUB_CACHE: /data
    volumes:
      - tei-data:/data
    # TEI's Rust HTTP client under amd64-emulation on arm64 hosts can fail to resolve
    # huggingface.co via Docker's embedded DNS (127.0.0.11) on user-defined bridges.
    # Pin to public resolvers so the first-run model download succeeds.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s   # first-run model download (~2.2 GB)
    networks:
      - datris-net

  datris:
    #image: datrisai/datris-server:latest
    build: .  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: datris
    ports:
      - "8080:8080"
    depends_on:
      vault-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      activemq:
        condition: service_started
      mongodb:
        condition: service_started
      postgres:
        condition: service_healthy
      tei:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root-token
    volumes:
      - ./docker/config:/config
      - pip-cache:/root/.cache/pip
    networks:
      - datris-net

  ui:
    #image: datrisai/datris-ui:latest
    build: ./ui  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: ui
    ports:
      - "4200:8080"
    depends_on:
      - datris
    networks:
      - datris-net

  mcp-server:
    #image: datrisai/datris-mcp-server:latest
    build: ./mcp-server  # Uncomment to build from source instead of pulling from Docker Hub
    container_name: mcp-server
    ports:
      - "3000:3000"
    environment:
      PIPELINE_URL: http://datris:8080
      PIPELINE_API_KEY: ${PIPELINE_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_ENDPOINT: ${EMBEDDING_ENDPOINT:-http://host.docker.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_HOST: host.docker.internal
      QDRANT_PORT: "6333"
      WEAVIATE_HOST: host.docker.internal
      WEAVIATE_PORT: "8079"
      WEAVIATE_GRPC_PORT: "50051"
      MILVUS_HOST: host.docker.internal
      MILVUS_PORT: "19530"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: datris
      PG_USER: postgres
      PG_PASSWORD: postgres
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: oss
    depends_on:
      - datris
    networks:
      - datris-net

  # ================================================================
  # Optional Vector Databases
  # Uncomment whichever vector database you want to use.
  # pgvector is already included via the PostgreSQL service above.
  # ================================================================

  # Qdrant - high-performance vector database
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: qdrant
  #   ports:
  #     - "6333:6333"
  #     - "6334:6334"
  #   networks:
  #     - datris-net

  # Weaviate - open-source vector database (port 8079 to avoid conflict with pipeline on 8080)
  # weaviate:
  #   image: cr.weaviate.io/semitechnologies/weaviate:latest
  #   container_name: weaviate
  #   ports:
  #     - "8079:8080"
  #     - "50051:50051"
  #   networks:
  #     - datris-net

  # Chroma - lightweight vector database
  # chroma:
  #   image: chromadb/chroma:latest
  #   container_name: chroma
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - datris-net

  # Milvus - scalable vector database (requires etcd + minio dependencies)
  # See https://milvus.io/docs/install_standalone-docker.md for full setup.
  # Recommended: use the standalone embed script instead:
  #   curl -sfL https://raw.githubusercontent.com/milvus-io/milvus/master/scripts/standalone_embed.sh -o standalone_embed.sh
  #   bash standalone_embed.sh start

  # ================================================================
  # Optional: Ollama (local chat / CodeGen models)
  # The bundled embedding model has moved to the `tei` service above.
  # Re-enable this block (and the `ollama-data` volume at the top of
  # the file) only if you want to run local chat models like llama3
  # or qwen instead of using BYO Anthropic/OpenAI keys.
  # After uncommenting + `docker compose up -d ollama`, point Datris
  # at it via the AI Provider / CodeGen Provider dropdown in the
  # Configuration tab (provider: ollama).
  # NOTE: TEI takes host port 11434, so Ollama is mapped to 11435 here
  # to avoid a conflict.
  # ================================================================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama
  #   ports:
  #     - "11435:11434"
  #   environment:
  #     OLLAMA_NUM_PARALLEL: 4
  #     OLLAMA_KEEP_ALIVE: 30m
  #     OLLAMA_MAX_LOADED_MODELS: 2
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - datris-net

  # ================================================================
  # Optional: Kafka + Zookeeper + kafka-ui
  # Datris ships with kafka-clients in the assembly, so pipelines that
  # use a Kafka source/destination can point at any external broker
  # via the pipeline's Kafka secret. This bundled local broker is only
  # needed if you want to test Kafka pipelines without spinning up a
  # broker elsewhere.
  # Re-enable all three services AND the volumes at the top of the file
  # (kafka-data, zookeeper-data, zookeeper-log) to use locally.
  # ================================================================
  # zookeeper:
  #   image: confluentinc/cp-zookeeper:7.6.0
  #   container_name: zookeeper
  #   ports:
  #     - "2181:2181"
  #   environment:
  #     ZOOKEEPER_CLIENT_PORT: 2181
  #     ZOOKEEPER_TICK_TIME: 2000
  #     KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,srvr"
  #   volumes:
  #     - zookeeper-data:/var/lib/zookeeper/data
  #     - zookeeper-log:/var/lib/zookeeper/log
  #   healthcheck:
  #     test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #   networks:
  #     - datris-net
  #
  # kafka:
  #   image: confluentinc/cp-kafka:7.6.0
  #   container_name: kafka
  #   ports:
  #     - "9092:9092"
  #   depends_on:
  #     zookeeper:
  #       condition: service_healthy
  #   environment:
  #     KAFKA_BROKER_ID: 1
  #     KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   networks:
  #     - datris-net
  #
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: kafka-ui
  #   ports:
  #     - "8085:8080"
  #   depends_on:
  #     - kafka
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
  #   networks:
  #     - datris-net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
      datris:
        condition: service_started
    volumes:
      - ./docker/minio-init.sh:/minio-init.sh
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"
    networks:
      - datris-net

