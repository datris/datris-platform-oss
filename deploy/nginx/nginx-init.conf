worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Pre-TLS config: port 80 only, for initial certbot certificate request
    server {
        listen 80;
        server_name *.CUSTOMER_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'Datris is starting up — waiting for TLS certificate...';
            add_header Content-Type text/plain;
        }
    }
}
