worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # General settings
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1G;
    proxy_read_timeout 600s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;

    error_page 413 @entity_too_large;
    location @entity_too_large {
        default_type application/json;
        return 413 '{"error": "File too large. Maximum upload size is 1 GB."}';
    }

    # SSL settings
    ssl_certificate /etc/letsencrypt/live/CUSTOMER_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/CUSTOMER_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name *.CUSTOMER_DOMAIN;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # UI — app.{customer}.datris.ai
    server {
        listen 443 ssl;
        server_name app.CUSTOMER_DOMAIN;

        location /api/ {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://datris:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://ui:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # REST API — api.{customer}.datris.ai
    server {
        listen 443 ssl;
        server_name api.CUSTOMER_DOMAIN;

        limit_req zone=api burst=50 nodelay;

        location / {
            proxy_pass http://datris:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # MCP Server — mcp.{customer}.datris.ai
    server {
        listen 443 ssl;
        server_name mcp.CUSTOMER_DOMAIN;

        location / {
            proxy_pass http://mcp-server:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
        }
    }

    # MinIO Console — minio.{customer}.datris.ai (admin only)
    server {
        listen 443 ssl;
        server_name minio.CUSTOMER_DOMAIN;

        location / {
            proxy_pass http://minio:9001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ActiveMQ Console — activemq.{customer}.datris.ai (admin only)
    server {
        listen 443 ssl;
        server_name activemq.CUSTOMER_DOMAIN;

        location / {
            proxy_pass http://activemq:8161;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Vault UI — vault.{customer}.datris.ai (admin only)
    server {
        listen 443 ssl;
        server_name vault.CUSTOMER_DOMAIN;

        location / {
            proxy_pass http://vault:8200;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
