version = 3.8.3
runner.dialect = scala212

# Tuned to the existing hand-written style to minimize reformat churn:
# 4-space indent, long lines tolerated, no alignment blocks.
maxColumn = 160
indent.main = 4
indent.callSite = 4
indent.defnSite = 4
indent.ctorSite = 4
indent.extendSite = 4
align.preset = none
docstrings.style = keep
newlines.source = keep
rewrite.trailingCommas.style = keep
